name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RETICULUM_CONFORMANCE_REF: 0319444b20e0815f26c6b9ceeba8fa44de037c9b
  PYTHON_RETICULUM_REF: ea98db4f53dcf0defc0e71a16e60d28b1229c4e6
  PYTHON_RETICULUM_PARITY_REF: 99de23c040d507e3fefca19e87b182302902725d
  PYTHON_LXMF_REF: 727830cefda83d9c6e3982b48675425f3f988f9c

jobs:
  hil-pr:
    name: HIL PR level
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LXMF_PYTHON_BIN: python
      RETICULUM_PY_REPO: ${{ github.workspace }}/Reticulum
      LXMF_PY_REPO: ${{ github.workspace }}/LXMF
      PYTHON_RNS_PATH: ${{ github.workspace }}/Reticulum
      PYTHON_LXMF_PATH: ${{ github.workspace }}/LXMF
      PYTHON_RNS_PARITY_PATH: ${{ github.workspace }}/Reticulum-parity/RNS
      PYTHON_LXMF_PARITY_PATH: ${{ github.workspace }}/LXMF/LXMF
      LXMF_PY_COMPAT_HARNESS: ${{ github.workspace }}/tools/scripts/python_compat_harness.py
    steps:
      - name: Checkout LXMF-rs
        uses: actions/checkout@v4

      - name: Checkout reticulum-conformance
        uses: actions/checkout@v4
        with:
          repository: torlando-tech/reticulum-conformance
          ref: ${{ env.RETICULUM_CONFORMANCE_REF }}
          path: reticulum-conformance

      - name: Checkout pinned Python Reticulum
        uses: actions/checkout@v4
        with:
          repository: markqvist/Reticulum
          ref: ${{ env.PYTHON_RETICULUM_REF }}
          path: Reticulum

      - name: Checkout pinned Python LXMF
        uses: actions/checkout@v4
        with:
          repository: markqvist/LXMF
          ref: ${{ env.PYTHON_LXMF_REF }}
          path: LXMF

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python reference dependencies
        working-directory: reticulum-conformance
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'cryptography>=3.4.7' 'pyserial>=3.5' 'qrcode>=7.4.2'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Install Linux BLE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev

      - name: Checkout pinned Python Reticulum parity target
        uses: actions/checkout@v4
        with:
          repository: markqvist/Reticulum
          ref: ${{ env.PYTHON_RETICULUM_PARITY_REF }}
          path: Reticulum-parity

      - name: Record pinned revisions
        run: |
          git -C reticulum-conformance rev-parse HEAD
          git -C Reticulum rev-parse HEAD
          git -C Reticulum-parity rev-parse HEAD
          git -C LXMF rev-parse HEAD

      - name: Validate exact-target behavioral inventory
        run: |
          python3 tools/scripts/python_surface_inventory.py --self-test
          python3 tools/scripts/python_surface_inventory.py \
            --python-rns-path Reticulum-parity/RNS \
            --python-lxmf-path LXMF/LXMF \
            --mapping docs/status/python-surface-mapping.json \
            --json-out target/issue-605/python-surface-parity-1.5.4.json \
            --rust-out target/issue-605/python_software_parity-1.5.4.rs

      - name: Run byte-level Python and Rust wire conformance
        env:
          RETICULUM_PY_REPO: ${{ github.workspace }}/Reticulum-parity
          LXMF_PY_REPO: ${{ github.workspace }}/LXMF
        run: |
          python3 tools/scripts/python_wire_conformance.py \
            --python-rns-path Reticulum-parity \
            --python-lxmf-path LXMF \
            --output target/interop/python-rust-wire-conformance/verify-${{ github.run_id }}/report.json
          cargo test -p test-support --test wire_conformance -- --nocapture

      - name: Run repository-native PR HIL controller
        run: cargo xtask hil run --level pr --all --output target/hil/runs/pr-${{ github.run_id }}

      - name: Exclude auxiliary checkouts from candidate status
        run: |
          cat >> .git/info/exclude <<'EOF'
          /LXMF/
          /Reticulum/
          /Reticulum-parity/
          /reticulum-conformance/
          EOF
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Run exact-target Python compatibility matrix
        env:
          RETICULUM_PY_REPO: ${{ github.workspace }}/Reticulum-parity
          LXMF_PY_REPO: ${{ github.workspace }}/LXMF
          LXMF_PY_COMPAT_HARNESS: ${{ github.workspace }}/tools/scripts/python_compat_harness.py
          LXMF_PYTHON_BIN: python
        run: |
          python3 tools/scripts/test_python_compat_matrix.py
          python3 tools/scripts/python_compat_matrix.py \
            --all \
            --output target/interop/python-compat-matrix/verify-${{ github.run_id }}/matrix.json \
            --timeout 420

      - name: Generate PR HIL support report
        if: always()
        run: cargo xtask hil report --evidence target/hil/runs/pr-${{ github.run_id }} --output target/hil/runs/pr-${{ github.run_id }}/support-report

      - name: Verify bidirectional Resource timeout and recovery
        env:
          RETICULUM_PY_REPO: ${{ github.workspace }}/Reticulum-parity
          LXMF_PYTHON_BIN: python
        run: |
          cargo test -p reticulumd --test python_channel_interop \
            pinned_python_link_timeout_and_reconnect_after_dropped_keepalives \
            -- --ignored --nocapture --test-threads=1
          cargo test -p reticulumd --test python_channel_interop \
            pinned_python_initiated_link_timeout_fails_then_recovers_inbound_resource \
            -- --ignored --nocapture --test-threads=1

      - name: Upload PR HIL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hil-pr-${{ github.run_id }}
          path: target/hil/runs/pr-${{ github.run_id }}/**
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-compat-matrix-${{ github.run_id }}
          path: target/interop/python-compat-matrix/verify-${{ github.run_id }}/**
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-behavioral-inventory-${{ github.run_id }}
          path: target/issue-605/**
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-rust-wire-conformance-${{ github.run_id }}
          path: target/interop/python-rust-wire-conformance/verify-${{ github.run_id }}/**
          if-no-files-found: error
