name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RETICULUM_CONFORMANCE_REF: 0319444b20e0815f26c6b9ceeba8fa44de037c9b
  PYTHON_RETICULUM_REF: ea98db4f53dcf0defc0e71a16e60d28b1229c4e6
  PYTHON_RETICULUM_PARITY_REF: 99de23c040d507e3fefca19e87b182302902725d
  PYTHON_LXMF_REF: 727830cefda83d9c6e3982b48675425f3f988f9c

jobs:
  hil-pr:
    name: HIL PR level
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LXMF_PYTHON_BIN: python
      RETICULUM_PY_REPO: ${{ github.workspace }}/Reticulum
      LXMF_PY_REPO: ${{ github.workspace }}/LXMF
      PYTHON_RNS_PATH: ${{ github.workspace }}/Reticulum
      PYTHON_LXMF_PATH: ${{ github.workspace }}/LXMF
      PYTHON_RNS_PARITY_PATH: ${{ github.workspace }}/Reticulum-parity/RNS
      PYTHON_LXMF_PARITY_PATH: ${{ github.workspace }}/LXMF/LXMF
      LXMF_PY_COMPAT_HARNESS: ${{ github.workspace }}/tools/scripts/python_compat_harness.py
    steps:
      - name: Checkout LXMF-rs
        uses: actions/checkout@v4

      - name: Checkout reticulum-conformance
        uses: actions/checkout@v4
        with:
          repository: torlando-tech/reticulum-conformance
          ref: ${{ env.RETICULUM_CONFORMANCE_REF }}
          path: reticulum-conformance

      - name: Checkout pinned Python Reticulum
        uses: actions/checkout@v4
        with:
          repository: markqvist/Reticulum
          ref: ${{ env.PYTHON_RETICULUM_REF }}
          path: Reticulum

      - name: Checkout pinned Python LXMF
        uses: actions/checkout@v4
        with:
          repository: markqvist/LXMF
          ref: ${{ env.PYTHON_LXMF_REF }}
          path: LXMF

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python reference dependencies
        working-directory: reticulum-conformance
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'cryptography>=3.4.7' 'pyserial>=3.5' 'qrcode>=7.4.2'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Install Linux BLE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev ffmpeg imagemagick graphicsmagick squashfs-tools

      - name: Install pinned ImageMagick 7 AppImage with WebP support
        run: |
          asset=ImageMagick-7.1.2-31-gcc-x86_64.AppImage
          image="$RUNNER_TEMP/$asset"
          appdir="$RUNNER_TEMP/imagemagick-appdir"
          curl --fail --location --retry 3 \
            "https://github.com/ImageMagick/ImageMagick/releases/download/7.1.2-31/$asset" \
            --output "$image"
          printf '%s  %s\n' \
            'b22dee096a68e7eb6771a6f98c16490ea78d399ffa27f34ca2ec4f02e707fd9c' \
            "$image" | sha256sum --check
          chmod +x "$image"
          offset=$("$image" --appimage-offset)
          test "$offset" -gt 0
          unsquashfs -no-progress -o "$offset" -d "$appdir" "$image"
          test -x "$appdir/AppRun"
          test -x "$appdir/usr/bin/magick"
          mkdir -p "$RUNNER_TEMP/magick-bin"
          printf '#!/bin/sh\nunset APPIMAGE ARGV0\nexec "%s/AppRun" "$@"\n' \
            "$appdir" > "$RUNNER_TEMP/magick-bin/magick"
          chmod +x "$RUNNER_TEMP/magick-bin/magick"
          printf '%s\n' "$RUNNER_TEMP/magick-bin" >> "$GITHUB_PATH"

      - name: Smoke-test pinned ImageMagick WebP encode and decode
        run: |
          magick -version
          input="$RUNNER_TEMP/magick-webp-smoke.png"
          output="$RUNNER_TEMP/magick-webp-smoke.webp"
          decoded="$RUNNER_TEMP/magick-webp-smoke-decoded.png"
          magick -size 8x4 xc:red "$input"
          magick "$input" "$output"
          magick "$output" "$decoded"
          python3 - "$output" "$decoded" <<'PY'
          import json
          import subprocess
          import sys

          webp, decoded = sys.argv[1:]
          probe = subprocess.run(
              ["ffprobe", "-v", "error", "-select_streams", "v:0", "-show_entries",
               "stream=codec_name,width,height", "-of", "json", webp],
              check=True, capture_output=True, text=True,
          )
          stream = json.loads(probe.stdout)["streams"][0]
          assert stream == {"codec_name": "webp", "width": 8, "height": 4}, stream
          identify = subprocess.run(
              ["magick", "identify", "-format", "%w %h", decoded],
              check=True, capture_output=True, text=True,
          )
          assert identify.stdout == "8 4", identify.stdout
          PY

      - name: Checkout pinned Python Reticulum parity target
        uses: actions/checkout@v4
        with:
          repository: markqvist/Reticulum
          ref: ${{ env.PYTHON_RETICULUM_PARITY_REF }}
          path: Reticulum-parity

      - name: Run pinned Python rngit concurrency, CLI, and malformed-request interoperability
        env:
          RETICULUM_PY_REPO: ${{ github.workspace }}/Reticulum-parity
          LXMF_PYTHON_BIN: python
        run: >-
          cargo test -p rns-tools --test rngit_concurrent_python_interop
          -- --ignored --nocapture

      - name: Record pinned revisions
        run: |
          git -C reticulum-conformance rev-parse HEAD
          git -C Reticulum rev-parse HEAD
          git -C Reticulum-parity rev-parse HEAD
          git -C LXMF rev-parse HEAD

      - name: Validate exact-target behavioral inventory
        run: |
          python3 tools/scripts/python_surface_inventory.py --self-test
          python3 tools/scripts/python_surface_inventory.py \
            --python-rns-path Reticulum-parity/RNS \
            --python-lxmf-path LXMF/LXMF \
            --mapping docs/status/python-surface-mapping.json \
            --json-out target/issue-605/python-surface-parity-1.5.4.json \
            --rust-out target/issue-605/python_software_parity-1.5.4.rs

      - name: Run byte-level Python and Rust wire conformance
        env:
          RETICULUM_PY_REPO: ${{ github.workspace }}/Reticulum-parity
          LXMF_PY_REPO: ${{ github.workspace }}/LXMF
        run: |
          python3 tools/scripts/python_wire_conformance.py \
            --python-rns-path Reticulum-parity \
            --python-lxmf-path LXMF \
            --output target/interop/python-rust-wire-conformance/verify-${{ github.run_id }}/report.json
          cargo test -p test-support --test wire_conformance -- --nocapture

      - name: Run repository-native PR HIL controller
        run: cargo xtask hil run --level pr --all --output target/hil/runs/pr-${{ github.run_id }}

      - name: Exclude auxiliary checkouts from candidate status
        run: |
          cat >> .git/info/exclude <<'EOF'
          /LXMF/
          /Reticulum/
          /Reticulum-parity/
          /reticulum-conformance/
          EOF
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Run exact-target Python compatibility matrix
        env:
          RETICULUM_PY_REPO: ${{ github.workspace }}/Reticulum-parity
          LXMF_PY_REPO: ${{ github.workspace }}/LXMF
          LXMF_PY_COMPAT_HARNESS: ${{ github.workspace }}/tools/scripts/python_compat_harness.py
          LXMF_PYTHON_BIN: python
        run: |
          python3 tools/scripts/test_python_compat_matrix.py
          python3 tools/scripts/python_compat_matrix.py \
            --all \
            --output target/interop/python-compat-matrix/verify-${{ github.run_id }}/matrix.json \
            --timeout 420

      - name: Run pinned Python rngit pages and media interoperability
        env:
          RETICULUM_PY_REPO: ${{ github.workspace }}/Reticulum-parity
          LXMF_PYTHON_BIN: python
          PYTHONPATH: ${{ github.workspace }}/Reticulum-parity
        run: |
          cargo test -p rns-tools --test rngit_python_interop \
            rngit_serves_pages_and_media_to_pinned_python_client \
            -- --ignored --nocapture

      - name: Verify forced unavailable WebP backend does not fall through over pinned Python Link
        env:
          RETICULUM_PY_REPO: ${{ github.workspace }}/Reticulum-parity
          LXMF_PYTHON_BIN: python
          PYTHONPATH: ${{ github.workspace }}/Reticulum-parity
        run: |
          cargo test -p rns-tools --test rngit_python_interop \
            rngit_does_not_fall_through_from_unavailable_forced_backend \
            -- --ignored --exact --nocapture --test-threads=1

      - name: Verify real ImageMagick, ImageMagick 7, and GraphicsMagick WebP backends over pinned Python Links
        env:
          RETICULUM_PY_REPO: ${{ github.workspace }}/Reticulum-parity
          LXMF_PYTHON_BIN: python
          PYTHONPATH: ${{ github.workspace }}/Reticulum-parity
        run: |
          for backend in convert magick gm; do
            RNGIT_TEST_WEBP_BACKEND="$backend" cargo test -p rns-tools --test rngit_python_interop \
              issue_613_configured_backend::configured_backend_serves_decodable_webp_and_falls_back_to_raw_media \
              -- --ignored --exact --nocapture --test-threads=1
          done

      - name: Run pinned Python blocked anonymous no-ident page interoperability
        env:
          RETICULUM_PY_REPO: ${{ github.workspace }}/Reticulum-parity
          LXMF_PYTHON_BIN: python
          PYTHONPATH: ${{ github.workspace }}/Reticulum-parity
        run: |
          cargo test -p rns-tools --test rngit_python_interop \
            issue_613_no_ident::rngit_returns_reference_no_ident_page_to_blocked_anonymous_python_link \
            -- --ignored --exact --nocapture --test-threads=1

      - name: Run pinned Python rngit media validation differential
        env:
          RETICULUM_PY_REPO: ${{ github.workspace }}/Reticulum-parity
          LXMF_PYTHON_BIN: python
          PYTHONPATH: ${{ github.workspace }}/Reticulum-parity
        run: |
          cargo test -p rns-tools --test rngit_python_interop \
            issue_613_media_invalid_ref::rngit_media_validation_denials_return_false_over_python_link \
            -- --ignored --exact --nocapture --test-threads=1

      - name: Verify pinned Python rngit media read-failure behavior
        env:
          RETICULUM_PY_REPO: ${{ github.workspace }}/Reticulum-parity
          LXMF_PYTHON_BIN: python
          PYTHONPATH: ${{ github.workspace }}/Reticulum-parity
        run: |
          cargo test -p rns-tools --test rngit_python_interop \
            issue_613_media_read_failure::rngit_media_content_read_failure_has_no_python_link_response \
            -- --ignored --exact --nocapture --test-threads=1

      - name: Verify pinned Python rngit media filesystem-failure fallbacks
        env:
          RETICULUM_PY_REPO: ${{ github.workspace }}/Reticulum-parity
          LXMF_PYTHON_BIN: python
          PYTHONPATH: ${{ github.workspace }}/Reticulum-parity
        run: |
          cargo test -p rns-tools --test rngit_python_interop \
            issue_613_temp_directory_failure::rngit_media_temp_directory_creation_failure_returns_raw_resource \
            -- --ignored --exact --nocapture --test-threads=1
          cargo test -p rns-tools --test rngit_python_interop \
            issue_613_output_open_failure::rngit_media_output_open_failure_returns_raw_resource \
            -- --ignored --exact --nocapture --test-threads=1
          cargo test -p rns-tools --test rngit_python_interop \
            issue_613_output_write_failure::rngit_media_output_write_failure_returns_raw_resource \
            -- --ignored --exact --nocapture --test-threads=1
          cargo test -p rns-tools --test rngit_python_interop \
            issue_613_media_source_open_failure::rngit_media_source_stream_open_failure_has_no_response_and_keeps_link_live \
            -- --ignored --exact --nocapture --test-threads=1

      - name: Verify raw media fallback when WebP backend is unavailable
        env:
          RETICULUM_PY_REPO: ${{ github.workspace }}/Reticulum-parity
          LXMF_PYTHON_BIN: python
          PYTHONPATH: ${{ github.workspace }}/Reticulum-parity
        run: |
          cargo test -p rns-tools --test rngit_python_interop \
            rngit_returns_raw_media_when_webp_backend_is_unavailable \
            -- --ignored --exact --nocapture --test-threads=1

      - name: Verify pinned Python configured media conversion and Resource flag
        env:
          RETICULUM_PY_REPO: ${{ github.workspace }}/Reticulum-parity
          LXMF_PYTHON_BIN: python
          PYTHONPATH: ${{ github.workspace }}/Reticulum-parity
        run: |
          cargo test -p rns-tools --test rngit_python_interop \
            issue_613_media_compression::rngit_media_resource_preserves_precompressed_png_without_resource_compression \
            -- --ignored --exact --nocapture --test-threads=1

      - name: Verify pinned Python WebP helper backend selection
        env:
          RETICULUM_PY_REPO: ${{ github.workspace }}/Reticulum-parity
          LXMF_PYTHON_BIN: python
          PYTHONPATH: ${{ github.workspace }}/Reticulum-parity
        run: |
          cargo test -p rns-tools --test rngit_python_interop \
            issue_613_media_compression::pinned_python_media_backend_selection_reuses_available_automatic_winner \
            -- --ignored --exact --nocapture --test-threads=1

      - name: Verify pinned Python rngit media CLI option forwarding
        env:
          RETICULUM_PY_REPO: ${{ github.workspace }}/Reticulum-parity
          LXMF_PYTHON_BIN: python
          PYTHONPATH: ${{ github.workspace }}/Reticulum-parity
        run: |
          cargo test -p rns-tools --test rngit_python_interop \
            issue_613_media_options::rngit_passes_media_cli_options_to_the_selected_webp_backend \
            -- --ignored --exact --nocapture --test-threads=1

      - name: Verify pinned Python avconv-selected production invocation
        env:
          RETICULUM_PY_REPO: ${{ github.workspace }}/Reticulum-parity
          LXMF_PYTHON_BIN: python
          PYTHONPATH: ${{ github.workspace }}/Reticulum-parity
        run: |
          cargo test -p rns-tools --test rngit_python_interop \
            issue_613_media_options::rngit_invokes_selected_avconv_backend_with_argument_safe_options \
            -- --ignored --exact --nocapture --test-threads=1

      - name: Verify pinned Python rngit encoder failure fallback and cleanup
        env:
          RETICULUM_PY_REPO: ${{ github.workspace }}/Reticulum-parity
          LXMF_PYTHON_BIN: python
          PYTHONPATH: ${{ github.workspace }}/Reticulum-parity
        run: |
          cargo test -p rns-tools --test rngit_python_interop \
            issue_613_media_options::rngit_failed_webp_encoder_returns_raw_media_and_cleans_conversion_directory \
            -- --ignored --exact --nocapture --test-threads=1

      - name: Generate PR HIL support report
        if: always()
        run: cargo xtask hil report --evidence target/hil/runs/pr-${{ github.run_id }} --output target/hil/runs/pr-${{ github.run_id }}/support-report

      - name: Verify pinned Python quote_plus image-markup edge fixture
        run: >-
          cargo test -p rns-tools --bin rngit --all-features
          tests::image_markup_matches_pinned_python_quote_plus_for_utf8_and_reserved_path_bytes
          -- --exact

      - name: Verify bidirectional Resource timeout and recovery
        env:
          RETICULUM_PY_REPO: ${{ github.workspace }}/Reticulum-parity
          LXMF_PYTHON_BIN: python
        run: |
          cargo test -p reticulumd --test python_channel_interop \
            pinned_python_link_timeout_and_reconnect_after_dropped_keepalives \
            -- --ignored --nocapture --test-threads=1
          cargo test -p reticulumd --test python_channel_interop \
            pinned_python_initiated_link_timeout_fails_then_recovers_inbound_resource \
            -- --ignored --nocapture --test-threads=1

      - name: Upload PR HIL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hil-pr-${{ github.run_id }}
          path: target/hil/runs/pr-${{ github.run_id }}/**
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-compat-matrix-${{ github.run_id }}
          path: target/interop/python-compat-matrix/verify-${{ github.run_id }}/**
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-behavioral-inventory-${{ github.run_id }}
          path: target/issue-605/**
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-rust-wire-conformance-${{ github.run_id }}
          path: target/interop/python-rust-wire-conformance/verify-${{ github.run_id }}/**
          if-no-files-found: error
