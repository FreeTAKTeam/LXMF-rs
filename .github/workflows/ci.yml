name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  selection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      selection: ${{ steps.select.outputs.selection }}
      bluetooth-msrv-185: ${{ steps.select.outputs['bluetooth-msrv-185'] }}
      bluetooth-companion: ${{ steps.select.outputs['bluetooth-companion'] }}
      mobile-ble-contract: ${{ steps.select.outputs['mobile-ble-contract'] }}
      quality: ${{ steps.select.outputs['quality'] }}
      architecture-checks: ${{ steps.select.outputs['architecture-checks'] }}
      build-matrix: ${{ steps.select.outputs['build-matrix'] }}
      windows-rnode-ble: ${{ steps.select.outputs['windows-rnode-ble'] }}
      macos-interface-runtime: ${{ steps.select.outputs['macos-interface-runtime'] }}
      linux-udp-runtime: ${{ steps.select.outputs['linux-udp-runtime'] }}
      linux-weave-runtime: ${{ steps.select.outputs['linux-weave-runtime'] }}
      test-nextest-unit: ${{ steps.select.outputs['test-nextest-unit'] }}
      peer-lifecycle-essential: ${{ steps.select.outputs['peer-lifecycle-essential'] }}
      contracts: ${{ steps.select.outputs['contracts'] }}
      security: ${{ steps.select.outputs['security'] }}
      test-integration: ${{ steps.select.outputs['test-integration'] }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Test selection and required-result policy
        run: |
          python3 -m unittest discover -s tools/scripts -p 'test_ci_*.py' -v
          python3 -m unittest discover -s tools/scripts -p 'test_branch_protection.py' -v
      - name: Select applicable checks
        id: select
        run: python3 tools/scripts/ci_selection.py
      - uses: actions/upload-artifact@v4
        with:
          name: ci-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/ci/selection.json
          if-no-files-found: error

  bluetooth-msrv-185:
    needs: selection
    if: ${{ needs.selection.outputs['bluetooth-msrv-185'] == 'true' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: aarch64-linux-android
      - name: Install BlueZ build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev
      - name: Packaged crate and independent consumer on MSRV
        run: tools/scripts/check-bluetooth-msrv.sh

  bluetooth-companion:
    needs: selection
    if: ${{ needs.selection.outputs['bluetooth-companion'] == 'true' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: python3 tools/scripts/check-bluetooth-companion.py
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 -m unittest discover -s tools/scripts -p test_bluetooth_artifact_pair.py -v
      - run: gradle -p android :rns-bluetooth:testDebugUnitTest :rns-bluetooth:lintDebug :rns-bluetooth:assembleRelease
      - name: Verify immutable Rust and AAR artifact pair
        run: |
          cargo package -p reticulum-rs-bluetooth --locked --no-verify
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("crates/libs/rns-bluetooth/Cargo.toml", "rb"))["package"]["version"])')
          for mode in create verify; do
            python3 tools/scripts/bluetooth-artifact-pair.py "$mode" --revision "$(git rev-parse HEAD)" --manifest target/bluetooth-pair.json --aar android/rns-bluetooth/build/outputs/aar/rns-bluetooth-release.aar --crate "target/package/reticulum-rs-bluetooth-$version.crate"
          done

  mobile-ble-contract:
    needs: selection
    if: ${{ needs.selection.outputs['mobile-ble-contract'] == 'true' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Existing SDK and mobile fixture contracts
        run: |
          cargo test -p lxmf-sdk --features mobile-ble-adapter --test mobile_ble_contract --test mobile_ble_adapter
          cargo test -p test-support --test mobile_ble_android_conformance --test mobile_ble_ios_conformance

  quality:
    needs: selection
    if: ${{ needs.selection.outputs['quality'] == 'true' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux BLE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-on-failure: false
      - name: Format
        run: cargo fmt --all -- --check
      - name: License metadata and packaged notices
        run: |
          python3 -m unittest discover -s tools/scripts -p test_license_metadata.py -v
          python3 tools/scripts/check_license_metadata.py
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --no-deps -- -D warnings
      - name: Check
        run: cargo check --workspace --all-targets


  architecture-checks:
    needs: selection
    if: ${{ needs.selection.outputs['architecture-checks'] == 'true' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-on-failure: false
      - name: Architecture checks
        run: cargo xtask ci --stage architecture-checks


  build-matrix:
    needs: selection
    if: ${{ needs.selection.outputs['build-matrix'] == 'true' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.88.0"]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux BLE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-on-failure: false
      - name: Build
        run: cargo xtask ci --stage build-matrix


  windows-rnode-ble:
    needs: selection
    if: ${{ needs.selection.outputs['windows-rnode-ble'] == 'true' }}
    timeout-minutes: 60
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-on-failure: false
      - name: Build Windows RNode BLE and run pairing/runtime tests
        run: cargo test -p reticulum-rs-transport --features rnode-ble --lib rnode_ble -- --nocapture


  macos-interface-runtime:
    needs: selection
    if: ${{ needs.selection.outputs['macos-interface-runtime'] == 'true' }}
    timeout-minutes: 60
    name: macOS interface runtime software tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-on-failure: false
      - name: Compile BLE-enabled interface runtime and run software tests
        run: cargo test -p reticulum-rs-transport --features rnode-ble --lib -- --nocapture


  linux-udp-runtime:
    needs: selection
    if: ${{ needs.selection.outputs['linux-udp-runtime'] == 'true' }}
    timeout-minutes: 60
    name: Linux configured UDP runtime software smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-on-failure: false
      - name: Verify configured UDP packet loopback, status, teardown, and restart
        run: ./tools/scripts/udp-configured-packet-smoke.sh
      - name: Upload UDP runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: udp-configured-packet-smoke-${{ github.run_id }}
          path: target/udp-configured-packet-smoke/report.json
          if-no-files-found: error


  linux-weave-runtime:
    needs: selection
    if: ${{ needs.selection.outputs['linux-weave-runtime'] == 'true' }}
    timeout-minutes: 60
    name: Linux configured Weave runtime software smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Weave fake-peer signing dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-cryptography
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-on-failure: false
      - name: Verify configured Weave runtime, display, status, and remote control
        run: TIMEOUT_SECS=60 ./tools/scripts/weave-fake-pty-smoke.sh
      - name: Upload Weave software evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weave-fake-pty-smoke-${{ github.run_id }}
          path: |
            target/weave-fake-pty-smoke/report.json
            target/weave-fake-pty-smoke/run.*/reticulumd.log
            target/weave-fake-pty-smoke/run.*/fake-weave.log
          if-no-files-found: error


  test-nextest-unit:
    needs: selection
    if: ${{ needs.selection.outputs['test-nextest-unit'] == 'true' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux BLE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-on-failure: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Unit tests (nextest)
        run: cargo xtask ci --stage test-nextest-unit


  peer-lifecycle-essential:
    needs: selection
    if: ${{ needs.selection.outputs['peer-lifecycle-essential'] == 'true' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      SDK_API_BREAK_TOOLCHAIN: nightly-2026-02-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux BLE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned nightly toolchain (for cargo-public-api)
        run: rustup toolchain install nightly-2026-02-15 --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-public-api@0.50.2
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-on-failure: false
      - name: Peer lifecycle contract gates
        run: |
          cargo xtask ci --stage interop-artifacts
          cargo xtask ci --stage schema-client-check
          cargo xtask ci --stage sdk-api-break


  contracts:
    needs: selection
    if: ${{ needs.selection.outputs['contracts'] == 'true' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux BLE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-on-failure: false
      - name: Docs
        run: cargo xtask ci --stage doc

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/security

  test-integration:
    needs: selection
    if: ${{ needs.selection.outputs['test-integration'] == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux BLE build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-on-failure: false
      - name: Selected integration tests
        env:
          CI_SELECTION: ${{ needs.selection.outputs.selection }}
        run: python3 tools/scripts/ci_integration.py

  required:
    name: CI required
    if: ${{ always() }}
    needs:
      - selection
      - bluetooth-msrv-185
      - bluetooth-companion
      - mobile-ble-contract
      - quality
      - architecture-checks
      - build-matrix
      - windows-rnode-ble
      - macos-interface-runtime
      - linux-udp-runtime
      - linux-weave-runtime
      - test-nextest-unit
      - peer-lifecycle-essential
      - contracts
      - security
      - test-integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Evaluate all selected outcomes
        env:
          CI_SELECTION: ${{ needs.selection.outputs.selection }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 tools/scripts/ci_gate.py
