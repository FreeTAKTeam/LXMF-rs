name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux BLE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-on-failure: false
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --no-deps -- -D warnings
      - name: Check
        run: cargo check --workspace --all-targets

  correctness:
    runs-on: ubuntu-latest
    env:
      SDK_CORRECTNESS_MIRI_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux BLE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly
          components: miri,rust-src
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-on-failure: false
      - name: Correctness (strict clippy + miri + loom)
        run: cargo xtask ci --stage correctness

  build-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux BLE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-on-failure: false
      - name: Build
        run: cargo xtask ci --stage build-matrix

  interfaces-build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux BLE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-on-failure: false
      - name: Interface build (Linux)
        run: cargo check -p reticulumd --all-targets

  interfaces-build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-on-failure: false
      - name: Interface build (macOS)
        run: cargo check -p reticulumd --all-targets

  interfaces-build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-on-failure: false
      - name: Interface build (Windows)
        run: cargo check -p reticulumd --all-targets

  interfaces-test-serial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux BLE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-on-failure: false
      - name: Serial interface tests
        run: cargo test -p reticulum-rs-transport serial::tests

  interfaces-test-ble-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux BLE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-on-failure: false
      - name: BLE interface tests (Linux)
        run: "cargo test -p reticulumd --bin reticulumd interfaces::ble::"

  interfaces-test-ble-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-on-failure: false
      - name: BLE interface tests (macOS)
        run: "cargo test -p reticulumd --bin reticulumd interfaces::ble::"

  interfaces-test-ble-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-on-failure: false
      - name: BLE interface tests (Windows)
        run: "cargo test -p reticulumd --bin reticulumd interfaces::ble::"

  interfaces-test-lora:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux BLE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-on-failure: false
      - name: LoRa interface tests
        run: cargo test -p reticulumd --bin reticulumd lora_state::tests

  interfaces-test-mobile-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux BLE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-on-failure: false
      - name: Mobile BLE host contract and conformance tests
        run: |
          cargo test -p lxmf-sdk --test mobile_ble_contract
          cargo test -p test-support --test mobile_ble_android_conformance --test mobile_ble_ios_conformance

  interfaces-boundary-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux BLE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-on-failure: false
      - name: Interface boundary policy check
        run: bash tools/scripts/check-boundaries.sh

  interfaces-required:
    runs-on: ubuntu-latest
    needs:
      - interfaces-build-linux
      - interfaces-build-macos
      - interfaces-build-windows
      - interfaces-test-serial
      - interfaces-test-ble-linux
      - interfaces-test-ble-macos
      - interfaces-test-ble-windows
      - interfaces-test-lora
      - interfaces-test-mobile-contract
      - interfaces-boundary-check
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux BLE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-on-failure: false
      - name: Interfaces required checks
        run: cargo xtask ci --stage interfaces-required

  embedded-node-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux BLE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-on-failure: false
      - name: Embedded native build checks
        run: cargo xtask ci --stage embedded-node-build

  embedded-node-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux BLE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-on-failure: false
      - name: Embedded native contract checks
        run: cargo xtask ci --stage embedded-node-contract

  embedded-node-failure-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux BLE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-on-failure: false
      - name: Embedded native failure matrix checks
        run: cargo xtask ci --stage embedded-node-failure-matrix

  embedded-node-hil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux BLE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-on-failure: false
      - name: Embedded native early interop harness
        run: cargo xtask ci --stage embedded-node-hil
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embedded-native-interop-artifacts
          path: |
            target/hil/native-node.log
            target/hil/native-node-report.json

  test-nextest-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux BLE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-on-failure: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Unit tests (nextest)
        run: cargo xtask ci --stage test-nextest-unit

  test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux BLE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-on-failure: false
      - name: Integration tests
        run: cargo test --workspace --tests

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux BLE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-on-failure: false
      - name: SDK schema fixtures
        run: cargo xtask ci --stage sdk-schema-check
      - name: Public crate packaging
        run: cargo xtask publish-crates --wave all --dry-run --allow-dirty
      - name: Operator tool compilation
        run: cargo check -p reticulumd -p rns-tools
      - name: Boundary policy check
        run: bash tools/scripts/check-boundaries.sh
      - name: Architecture checks
        run: cargo run -p xtask -- architecture-checks
      - name: Optional AES-128 Fernet feature graph
        run: |
          cargo check -p reticulum-rs-transport --features fernet-aes128 --tests
          cargo check -p lxmf-wire --features fernet-aes128 --tests
          cargo check -p reticulum-rs --features fernet-aes128
      - name: Delivery E2E compatibility
        run: cargo xtask ci --stage e2e-compatibility
      - name: SDK docs check
        run: cargo run -p xtask -- sdk-docs-check
      - name: SDK migration check
        run: cargo run -p xtask -- sdk-migration-check

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux BLE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-on-failure: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      - name: Dependency policy
        run: cargo deny check bans licenses sources
      - name: Advisory audit
        run: cargo audit --ignore RUSTSEC-2024-0421 --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2026-0009 --ignore RUSTSEC-2025-0134
      - name: Security review gates
        run: cargo xtask ci --stage security-review-check
