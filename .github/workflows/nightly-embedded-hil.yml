name: Nightly Embedded HIL

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

jobs:
  esp32-hil:
    if: ${{ vars.HIL_ESP32_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: ESP32 hardware-in-loop smoke
        env:
          HIL_SERIAL_PORT: ${{ vars.HIL_ESP32_SERIAL_PORT }}
          HIL_RPC_ENDPOINT: ${{ vars.HIL_ESP32_RPC_ENDPOINT }}
          HIL_SEND_SOURCE: ${{ vars.HIL_ESP32_SEND_SOURCE }}
          HIL_SEND_DESTINATION: ${{ vars.HIL_ESP32_SEND_DESTINATION }}
          HIL_TICK_MAX_WORK_ITEMS: ${{ vars.HIL_ESP32_TICK_MAX_WORK_ITEMS }}
          HIL_TICK_MAX_DURATION_MS: ${{ vars.HIL_ESP32_TICK_MAX_DURATION_MS }}
        run: cargo run -p xtask -- embedded-hil-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: esp32-hil-artifacts
          path: |
            target/hil/esp32-smoke.log
            target/hil/esp32-smoke-report.json

  i2p-prepared-host:
    if: ${{ vars.HIL_I2P_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: I2P prepared-host smoke
        env:
          SAM_HOST: ${{ vars.HIL_I2P_SAM_HOST }}
          SAM_PORT: ${{ vars.HIL_I2P_SAM_PORT }}
          I2P_PEERS: ${{ vars.HIL_I2P_PEERS }}
          TIMEOUT_SECS: ${{ vars.HIL_I2P_TIMEOUT_SECS }}
        run: ./tools/scripts/i2p-prepared-host-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i2p-prepared-host-artifacts
          path: |
            target/i2p-hil/report.json
            target/i2p-hil/run.*

  auto-interface-prepared-host:
    if: ${{ vars.HIL_AUTO_INTERFACE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: AutoInterface prepared-host churn smoke
        env:
          AUTO_CHURN_NETNS: ${{ vars.HIL_AUTO_INTERFACE_NETNS }}
          AUTO_CHURN_DEVICE: ${{ vars.HIL_AUTO_INTERFACE_DEVICE }}
          AUTO_CHURN_INITIAL_ADDR: ${{ vars.HIL_AUTO_INTERFACE_INITIAL_ADDR }}
          AUTO_CHURN_REPLACEMENT_ADDR: ${{ vars.HIL_AUTO_INTERFACE_REPLACEMENT_ADDR }}
          AUTO_CHURN_TIMEOUT_SECS: ${{ vars.HIL_AUTO_INTERFACE_TIMEOUT_SECS }}
        run: ./tools/scripts/auto-interface-prepared-host-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auto-interface-prepared-host-artifacts
          path: |
            target/auto-interface-hil/report.json
            target/auto-interface-hil/run.*

  rnode-multi-prepared-host:
    if: ${{ vars.HIL_RNODE_MULTI_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: RNodeMulti prepared-host smoke
        env:
          RNODE_MULTI_PORT: ${{ vars.HIL_RNODE_MULTI_PORT }}
          RNODE_MULTI_BAUD_RATE: ${{ vars.HIL_RNODE_MULTI_BAUD_RATE }}
          RNODE_MULTI_VPORTS: ${{ vars.HIL_RNODE_MULTI_VPORTS }}
          RNODE_MULTI_REGION: ${{ vars.HIL_RNODE_MULTI_REGION }}
          RNODE_MULTI_FREQUENCIES: ${{ vars.HIL_RNODE_MULTI_FREQUENCIES }}
          RNODE_MULTI_BANDWIDTHS: ${{ vars.HIL_RNODE_MULTI_BANDWIDTHS }}
          RNODE_MULTI_SPREADING_FACTORS: ${{ vars.HIL_RNODE_MULTI_SPREADING_FACTORS }}
          RNODE_MULTI_CODING_RATES: ${{ vars.HIL_RNODE_MULTI_CODING_RATES }}
          RNODE_MULTI_TX_POWERS: ${{ vars.HIL_RNODE_MULTI_TX_POWERS }}
          RNODE_MULTI_OUTGOING: ${{ vars.HIL_RNODE_MULTI_OUTGOING }}
          RNODE_MULTI_TIMEOUT_SECS: ${{ vars.HIL_RNODE_MULTI_TIMEOUT_SECS }}
        run: ./tools/scripts/rnode-multi-prepared-host-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rnode-multi-prepared-host-artifacts
          path: |
            target/rnode-multi-hil/report.json
            target/rnode-multi-hil/run.*

  rnode-prepared-host:
    if: ${{ vars.HIL_RNODE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: RNode prepared-host smoke
        env:
          RNODE_PORT: ${{ vars.HIL_RNODE_PORT }}
          RNODE_BAUD_RATE: ${{ vars.HIL_RNODE_BAUD_RATE }}
          RNODE_REGION: ${{ vars.HIL_RNODE_REGION }}
          RNODE_FREQUENCY: ${{ vars.HIL_RNODE_FREQUENCY }}
          RNODE_BANDWIDTH: ${{ vars.HIL_RNODE_BANDWIDTH }}
          RNODE_SPREADING_FACTOR: ${{ vars.HIL_RNODE_SPREADING_FACTOR }}
          RNODE_CODING_RATE: ${{ vars.HIL_RNODE_CODING_RATE }}
          RNODE_TX_POWER: ${{ vars.HIL_RNODE_TX_POWER }}
          RNODE_BITRATE: ${{ vars.HIL_RNODE_BITRATE }}
          RNODE_COMMAND_TIMEOUT_MS: ${{ vars.HIL_RNODE_COMMAND_TIMEOUT_MS }}
          RNODE_MAX_PAYLOAD_BYTES: ${{ vars.HIL_RNODE_MAX_PAYLOAD_BYTES }}
          RNODE_BLE_ADAPTER: ${{ vars.HIL_RNODE_BLE_ADAPTER }}
          RNODE_BLE_SCAN_TIMEOUT_MS: ${{ vars.HIL_RNODE_BLE_SCAN_TIMEOUT_MS }}
          RNODE_BLE_CONNECT_TIMEOUT_MS: ${{ vars.HIL_RNODE_BLE_CONNECT_TIMEOUT_MS }}
          RNODE_BLE_MAX_WRITE_LEN: ${{ vars.HIL_RNODE_BLE_MAX_WRITE_LEN }}
          RNODE_MANAGEMENT_TIMEOUT_SECS: ${{ vars.HIL_RNODE_MANAGEMENT_TIMEOUT_SECS }}
          RNODE_BLINK_PATTERN: ${{ vars.HIL_RNODE_BLINK_PATTERN }}
          RNODE_TIMEOUT_SECS: ${{ vars.HIL_RNODE_TIMEOUT_SECS }}
        run: ./tools/scripts/rnode-prepared-host-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rnode-prepared-host-artifacts
          path: |
            target/rnode-hil/report.json
            target/rnode-hil/run.*

  reticulum-interface-hil-matrix:
    if: ${{ vars.HIL_RNODE_MATRIX_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux BLE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev
      - name: Reticulum Interface #384/#385 HIL matrix
        env:
          RIF_RNODE_SERIAL_PORT: ${{ vars.HIL_RNODE_MATRIX_SERIAL_PORT }}
          RIF_RNODE_TCP_PORT: ${{ vars.HIL_RNODE_MATRIX_TCP_PORT }}
          RIF_RNODE_BLE_PORT: ${{ vars.HIL_RNODE_MATRIX_BLE_PORT }}
          RIF_RUN_LOCAL_SMOKES: ${{ vars.HIL_RNODE_MATRIX_RUN_LOCAL_SMOKES }}
          RIF_RNODE_SERIAL_BAUD_RATE: ${{ vars.HIL_RNODE_MATRIX_SERIAL_BAUD_RATE }}
          RIF_RNODE_SERIAL_REGION: ${{ vars.HIL_RNODE_MATRIX_SERIAL_REGION }}
          RIF_RNODE_SERIAL_FREQUENCY: ${{ vars.HIL_RNODE_MATRIX_SERIAL_FREQUENCY }}
          RIF_RNODE_SERIAL_BANDWIDTH: ${{ vars.HIL_RNODE_MATRIX_SERIAL_BANDWIDTH }}
          RIF_RNODE_SERIAL_SPREADING_FACTOR: ${{ vars.HIL_RNODE_MATRIX_SERIAL_SPREADING_FACTOR }}
          RIF_RNODE_SERIAL_CODING_RATE: ${{ vars.HIL_RNODE_MATRIX_SERIAL_CODING_RATE }}
          RIF_RNODE_SERIAL_TX_POWER: ${{ vars.HIL_RNODE_MATRIX_SERIAL_TX_POWER }}
          RIF_RNODE_SERIAL_BITRATE: ${{ vars.HIL_RNODE_MATRIX_SERIAL_BITRATE }}
          RIF_RNODE_SERIAL_COMMAND_TIMEOUT_MS: ${{ vars.HIL_RNODE_MATRIX_SERIAL_COMMAND_TIMEOUT_MS }}
          RIF_RNODE_SERIAL_MAX_PAYLOAD_BYTES: ${{ vars.HIL_RNODE_MATRIX_SERIAL_MAX_PAYLOAD_BYTES }}
          RIF_RNODE_SERIAL_MANAGEMENT_TIMEOUT_SECS: ${{ vars.HIL_RNODE_MATRIX_SERIAL_MANAGEMENT_TIMEOUT_SECS }}
          RIF_RNODE_SERIAL_BLINK_PATTERN: ${{ vars.HIL_RNODE_MATRIX_SERIAL_BLINK_PATTERN }}
          RIF_RNODE_SERIAL_TIMEOUT_SECS: ${{ vars.HIL_RNODE_MATRIX_SERIAL_TIMEOUT_SECS }}
          RIF_RNODE_TCP_BAUD_RATE: ${{ vars.HIL_RNODE_MATRIX_TCP_BAUD_RATE }}
          RIF_RNODE_TCP_REGION: ${{ vars.HIL_RNODE_MATRIX_TCP_REGION }}
          RIF_RNODE_TCP_FREQUENCY: ${{ vars.HIL_RNODE_MATRIX_TCP_FREQUENCY }}
          RIF_RNODE_TCP_BANDWIDTH: ${{ vars.HIL_RNODE_MATRIX_TCP_BANDWIDTH }}
          RIF_RNODE_TCP_SPREADING_FACTOR: ${{ vars.HIL_RNODE_MATRIX_TCP_SPREADING_FACTOR }}
          RIF_RNODE_TCP_CODING_RATE: ${{ vars.HIL_RNODE_MATRIX_TCP_CODING_RATE }}
          RIF_RNODE_TCP_TX_POWER: ${{ vars.HIL_RNODE_MATRIX_TCP_TX_POWER }}
          RIF_RNODE_TCP_BITRATE: ${{ vars.HIL_RNODE_MATRIX_TCP_BITRATE }}
          RIF_RNODE_TCP_COMMAND_TIMEOUT_MS: ${{ vars.HIL_RNODE_MATRIX_TCP_COMMAND_TIMEOUT_MS }}
          RIF_RNODE_TCP_MAX_PAYLOAD_BYTES: ${{ vars.HIL_RNODE_MATRIX_TCP_MAX_PAYLOAD_BYTES }}
          RIF_RNODE_TCP_MANAGEMENT_TIMEOUT_SECS: ${{ vars.HIL_RNODE_MATRIX_TCP_MANAGEMENT_TIMEOUT_SECS }}
          RIF_RNODE_TCP_BLINK_PATTERN: ${{ vars.HIL_RNODE_MATRIX_TCP_BLINK_PATTERN }}
          RIF_RNODE_TCP_TIMEOUT_SECS: ${{ vars.HIL_RNODE_MATRIX_TCP_TIMEOUT_SECS }}
          RIF_RNODE_BLE_BAUD_RATE: ${{ vars.HIL_RNODE_MATRIX_BLE_BAUD_RATE }}
          RIF_RNODE_BLE_REGION: ${{ vars.HIL_RNODE_MATRIX_BLE_REGION }}
          RIF_RNODE_BLE_FREQUENCY: ${{ vars.HIL_RNODE_MATRIX_BLE_FREQUENCY }}
          RIF_RNODE_BLE_BANDWIDTH: ${{ vars.HIL_RNODE_MATRIX_BLE_BANDWIDTH }}
          RIF_RNODE_BLE_SPREADING_FACTOR: ${{ vars.HIL_RNODE_MATRIX_BLE_SPREADING_FACTOR }}
          RIF_RNODE_BLE_CODING_RATE: ${{ vars.HIL_RNODE_MATRIX_BLE_CODING_RATE }}
          RIF_RNODE_BLE_TX_POWER: ${{ vars.HIL_RNODE_MATRIX_BLE_TX_POWER }}
          RIF_RNODE_BLE_BITRATE: ${{ vars.HIL_RNODE_MATRIX_BLE_BITRATE }}
          RIF_RNODE_BLE_COMMAND_TIMEOUT_MS: ${{ vars.HIL_RNODE_MATRIX_BLE_COMMAND_TIMEOUT_MS }}
          RIF_RNODE_BLE_MAX_PAYLOAD_BYTES: ${{ vars.HIL_RNODE_MATRIX_BLE_MAX_PAYLOAD_BYTES }}
          RIF_RNODE_BLE_ADAPTER: ${{ vars.HIL_RNODE_MATRIX_BLE_ADAPTER }}
          RIF_RNODE_BLE_SCAN_TIMEOUT_MS: ${{ vars.HIL_RNODE_MATRIX_BLE_SCAN_TIMEOUT_MS }}
          RIF_RNODE_BLE_CONNECT_TIMEOUT_MS: ${{ vars.HIL_RNODE_MATRIX_BLE_CONNECT_TIMEOUT_MS }}
          RIF_RNODE_BLE_MAX_WRITE_LEN: ${{ vars.HIL_RNODE_MATRIX_BLE_MAX_WRITE_LEN }}
          RIF_RNODE_BLE_MANAGEMENT_TIMEOUT_SECS: ${{ vars.HIL_RNODE_MATRIX_BLE_MANAGEMENT_TIMEOUT_SECS }}
          RIF_RNODE_BLE_BLINK_PATTERN: ${{ vars.HIL_RNODE_MATRIX_BLE_BLINK_PATTERN }}
          RIF_RNODE_BLE_TIMEOUT_SECS: ${{ vars.HIL_RNODE_MATRIX_BLE_TIMEOUT_SECS }}
          RNODE_BAUD_RATE: ${{ vars.HIL_RNODE_BAUD_RATE }}
          RNODE_REGION: ${{ vars.HIL_RNODE_REGION }}
          RNODE_FREQUENCY: ${{ vars.HIL_RNODE_FREQUENCY }}
          RNODE_BANDWIDTH: ${{ vars.HIL_RNODE_BANDWIDTH }}
          RNODE_SPREADING_FACTOR: ${{ vars.HIL_RNODE_SPREADING_FACTOR }}
          RNODE_CODING_RATE: ${{ vars.HIL_RNODE_CODING_RATE }}
          RNODE_TX_POWER: ${{ vars.HIL_RNODE_TX_POWER }}
          RNODE_BITRATE: ${{ vars.HIL_RNODE_BITRATE }}
          RNODE_COMMAND_TIMEOUT_MS: ${{ vars.HIL_RNODE_COMMAND_TIMEOUT_MS }}
          RNODE_MAX_PAYLOAD_BYTES: ${{ vars.HIL_RNODE_MAX_PAYLOAD_BYTES }}
          RNODE_BLE_ADAPTER: ${{ vars.HIL_RNODE_BLE_ADAPTER }}
          RNODE_BLE_SCAN_TIMEOUT_MS: ${{ vars.HIL_RNODE_BLE_SCAN_TIMEOUT_MS }}
          RNODE_BLE_CONNECT_TIMEOUT_MS: ${{ vars.HIL_RNODE_BLE_CONNECT_TIMEOUT_MS }}
          RNODE_BLE_MAX_WRITE_LEN: ${{ vars.HIL_RNODE_BLE_MAX_WRITE_LEN }}
          RNODE_MANAGEMENT_TIMEOUT_SECS: ${{ vars.HIL_RNODE_MANAGEMENT_TIMEOUT_SECS }}
          RNODE_BLINK_PATTERN: ${{ vars.HIL_RNODE_BLINK_PATTERN }}
          RNODE_TIMEOUT_SECS: ${{ vars.HIL_RNODE_TIMEOUT_SECS }}
        run: ./tools/scripts/reticulum-interface-hil-matrix.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reticulum-interface-hil-matrix-artifacts
          path: |
            target/reticulum-interface-hil-matrix/report.json
            target/reticulum-interface-hil-matrix/parity-audit-report.json
            target/reticulum-interface-hil-matrix/artifact-manifest.json
            target/reticulum-interface-hil-matrix/rnode-*
            target/rnode-hil/matrix/*.report.json

  weave-prepared-host:
    if: ${{ vars.HIL_WEAVE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Weave prepared-host smoke
        env:
          WEAVE_PORT: ${{ vars.HIL_WEAVE_PORT }}
          WEAVE_BAUD_RATE: ${{ vars.HIL_WEAVE_BAUD_RATE }}
          WEAVE_MTU: ${{ vars.HIL_WEAVE_MTU }}
          WEAVE_CONFIGURED_BITRATE: ${{ vars.HIL_WEAVE_CONFIGURED_BITRATE }}
          WEAVE_REQUIRE_CONNECTED: ${{ vars.HIL_WEAVE_REQUIRE_CONNECTED }}
          WEAVE_REMOTE_DISPLAY_CONTROL: ${{ vars.HIL_WEAVE_REMOTE_DISPLAY_CONTROL }}
          WEAVE_TIMEOUT_SECS: ${{ vars.HIL_WEAVE_TIMEOUT_SECS }}
        run: ./tools/scripts/weave-prepared-host-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weave-prepared-host-artifacts
          path: |
            target/weave-hil/report.json
            target/weave-hil/run.*

  vrn76-prepared-host:
    if: ${{ vars.HIL_VRN76_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux BLE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev
      - name: VR-N76 KISS BLE prepared-host smoke
        env:
          VRN76_PERIPHERAL_ID: ${{ vars.HIL_VRN76_PERIPHERAL_ID }}
          VRN76_ADAPTER: ${{ vars.HIL_VRN76_ADAPTER }}
          VRN76_MTU: ${{ vars.HIL_VRN76_MTU }}
          VRN76_MAX_WRITE_LEN: ${{ vars.HIL_VRN76_MAX_WRITE_LEN }}
          VRN76_FRAME_MODE: ${{ vars.HIL_VRN76_FRAME_MODE }}
          VRN76_KISS_FLOW_CONTROL: ${{ vars.HIL_VRN76_KISS_FLOW_CONTROL }}
          VRN76_SCAN_TIMEOUT_MS: ${{ vars.HIL_VRN76_SCAN_TIMEOUT_MS }}
          VRN76_CONNECT_TIMEOUT_MS: ${{ vars.HIL_VRN76_CONNECT_TIMEOUT_MS }}
          VRN76_TIMEOUT_SECS: ${{ vars.HIL_VRN76_TIMEOUT_SECS }}
        run: ./tools/scripts/vrn76-kiss-ble-prepared-host-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vrn76-prepared-host-artifacts
          path: |
            target/vrn76-hil/report.json
            target/vrn76-hil/run.*

  hil-disabled:
    if: ${{ vars.HIL_ESP32_ENABLED != 'true' && vars.HIL_I2P_ENABLED != 'true' && vars.HIL_AUTO_INTERFACE_ENABLED != 'true' && vars.HIL_RNODE_MULTI_ENABLED != 'true' && vars.HIL_RNODE_ENABLED != 'true' && vars.HIL_RNODE_MATRIX_ENABLED != 'true' && vars.HIL_WEAVE_ENABLED != 'true' && vars.HIL_VRN76_ENABLED != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: HIL disabled
        run: echo "HIL_ESP32_ENABLED, HIL_I2P_ENABLED, HIL_AUTO_INTERFACE_ENABLED, HIL_RNODE_MULTI_ENABLED, HIL_RNODE_ENABLED, HIL_RNODE_MATRIX_ENABLED, HIL_WEAVE_ENABLED, and HIL_VRN76_ENABLED are not set to true; skipping nightly HIL runs."
