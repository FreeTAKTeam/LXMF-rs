name: Release runner network diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  network:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Inspect package-server DNS and connectivity
        shell: bash
        run: |
          cat /etc/os-release
          cat /etc/resolv.conf
          for host in archive.ubuntu.com security.ubuntu.com azure.archive.ubuntu.com mirrors.edge.kernel.org; do
            echo "DNS $host"
            timeout 15s getent ahostsv4 "$host" || true
            curl -I --connect-timeout 10 --max-time 20 "https://$host/ubuntu/" || true
          done
      - name: Verify signed package index and dependencies
        run: |
          sudo timeout 180s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o APT::Update::Error-Mode=any update
          sudo timeout 120s apt-get -o Acquire::Retries=1 install -y libdbus-1-dev pkg-config
