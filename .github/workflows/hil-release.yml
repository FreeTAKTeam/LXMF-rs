name: HIL release acceptance

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Commit, tag, or branch to validate.
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: hil-rack-primary
  cancel-in-progress: false

jobs:
  virtual-reference:
    name: Release virtual/reference evidence
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      LXMF_PYTHON_BIN: python
      RETICULUM_PY_REPO: ${{ github.workspace }}/Reticulum
      LXMF_PY_REPO: ${{ github.workspace }}/LXMF
      PYTHON_RNS_PATH: ${{ github.workspace }}/Reticulum
      PYTHON_LXMF_PATH: ${{ github.workspace }}/LXMF
      LXMF_PY_COMPAT_HARNESS: ${{ github.workspace }}/tools/scripts/python_compat_harness.py
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref }}
      - uses: actions/checkout@v4
        with:
          repository: torlando-tech/reticulum-conformance
          ref: 0319444b20e0815f26c6b9ceeba8fa44de037c9b
          path: reticulum-conformance
      - uses: actions/checkout@v4
        with:
          repository: markqvist/Reticulum
          ref: e32d4df754a7b87b1bf1bb0d08675d12ff505ae6
          path: Reticulum
      - uses: actions/checkout@v4
        with:
          repository: markqvist/LXMF
          ref: 727830cefda83d9c6e3982b48675425f3f988f9c
          path: LXMF
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python reference dependencies
        working-directory: reticulum-conformance
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'cryptography>=3.4.7' 'pyserial>=3.5' 'qrcode>=7.4.2'
      - name: Install Linux BLE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo xtask hil run --level release --profile virtual --output target/hil/runs/virtual-${{ github.run_id }}
      - run: cargo xtask hil run --level release --profile python-reference --output target/hil/runs/python-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hil-release-reference-${{ github.run_id }}
          path: target/hil/runs/**/*
          if-no-files-found: error

  linux-lab:
    name: Release physical ${{ matrix.profile }}
    runs-on: [self-hosted, hil-linux]
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        profile:
          - heltec
          - tbeam
          - vr-n76
          - kiss
          - ax25
          - serial
          - tcp
          - ble
          - esp32
          - i2p
          - i2p-pair
          - auto-interface
          - rnode-multi
          - rnode-prepared
          - reticulum-interface-matrix
          - weave
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo xtask hil run --level release --profile ${{ matrix.profile }} --output target/hil/runs/${{ matrix.profile }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hil-release-${{ matrix.profile }}-${{ github.run_id }}
          path: target/hil/runs/${{ matrix.profile }}-${{ github.run_id }}/**
          if-no-files-found: error

  windows-lab:
    name: Release Windows physical ${{ matrix.profile }}
    runs-on: [self-hosted, hil-windows]
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        profile: [spp, windows]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo xtask hil run --level release --profile ${{ matrix.profile }} --output target/hil/runs/${{ matrix.profile }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hil-release-${{ matrix.profile }}-${{ github.run_id }}
          path: target/hil/runs/${{ matrix.profile }}-${{ github.run_id }}/**
          if-no-files-found: error

  android-lab:
    name: Release Android physical
    runs-on: [self-hosted, hil-android]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo xtask hil run --level release --profile android --output target/hil/runs/android-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hil-release-android-${{ github.run_id }}
          path: target/hil/runs/android-${{ github.run_id }}/**
          if-no-files-found: error

  report:
    name: Generate release support matrix
    if: always()
    needs: [virtual-reference, linux-lab, windows-lab, android-lab]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          pattern: hil-release-*
          path: target/hil/runs
      - name: Generate support matrix
        run: cargo xtask hil report --evidence target/hil/runs --output target/hil/report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hil-release-report-${{ github.run_id }}
          path: target/hil/report/**
          if-no-files-found: error
