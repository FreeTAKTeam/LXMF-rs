name: Legacy Release Bundles (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version or tag name to embed in bundle filenames
        required: true
        type: string
      publish_release:
        description: Publish uploaded bundle artifacts to the matching GitHub release
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-release-version:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release version format
        run: |
          [[ "$RELEASE_VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
      - name: Require an existing tag before manual publish
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        run: |
          git rev-parse -q --verify "refs/tags/$RELEASE_VERSION"

  sdk-wrapper-parity:
    needs: validate-release-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux BLE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-on-failure: false
      - name: SDK wrapper parity gate
        run: cargo test -p test-support sdk_wrapper_parity_release_gate

  build-bundles:
    needs: [validate-release-version, sdk-wrapper-parity]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: daemon-bundle-linux
            rust_target: ""
          - os: macos-latest
            artifact_name: daemon-bundle-macos
            rust_target: ""
          - os: windows-latest
            artifact_name: daemon-bundle-windows
            rust_target: ""
          - os: ubuntu-latest
            artifact_name: daemon-bundle-linux-arm64
            rust_target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux' && matrix.rust_target == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev
      - name: Install Linux ARM64 bundle dependencies
        if: runner.os == 'Linux' && matrix.rust_target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture arm64
          sudo python3 - <<'PY'
          from pathlib import Path

          def restrict_deb_list(path: Path) -> None:
              lines = []
              changed = False
              for line in path.read_text().splitlines():
                  if line.startswith("deb ") and not line.startswith("deb ["):
                      line = line.replace("deb ", "deb [arch=amd64] ", 1)
                      changed = True
                  lines.append(line)
              if changed:
                  path.write_text("\n".join(lines) + "\n")

          def restrict_deb822(path: Path) -> None:
              blocks = path.read_text().split("\n\n")
              rewritten = []
              changed = False
              for block in blocks:
                  if not block.strip():
                      rewritten.append(block)
                      continue
                  lines = block.splitlines()
                  if any(line.startswith("Architectures:") for line in lines):
                      next_lines = []
                      for line in lines:
                          if line.startswith("Architectures:"):
                              line = "Architectures: amd64"
                              changed = True
                          next_lines.append(line)
                      lines = next_lines
                  elif any(line == "Types: deb" for line in lines):
                      for index, line in enumerate(lines):
                          if line == "Types: deb":
                              lines.insert(index + 1, "Architectures: amd64")
                              changed = True
                              break
                  rewritten.append("\n".join(lines))
              if changed:
                  path.write_text("\n\n".join(rewritten))

          sources = [Path("/etc/apt/sources.list")]
          sources.extend(Path("/etc/apt/sources.list.d").glob("*.list"))
          for source in sources:
              if source.exists():
                  restrict_deb_list(source)
          for source in Path("/etc/apt/sources.list.d").glob("*.sources"):
              restrict_deb822(source)
          PY
          sudo tee /etc/apt/sources.list.d/ubuntu-arm64.sources > /dev/null <<'EOF'
          Types: deb
          Architectures: arm64
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: noble noble-updates noble-backports noble-security
          Components: main universe restricted multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross pkg-config libdbus-1-dev:arm64
      - uses: dtolnay/rust-toolchain@stable
      - name: Add Rust target
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-on-failure: false
      - name: Build daemon bundle
        if: runner.os != 'Windows'
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          PKG_CONFIG_ALLOW_CROSS: ${{ matrix.rust_target == 'aarch64-unknown-linux-gnu' && '1' || '' }}
          PKG_CONFIG_PATH: ${{ matrix.rust_target == 'aarch64-unknown-linux-gnu' && '/usr/lib/aarch64-linux-gnu/pkgconfig' || '' }}
        run: |
          if [[ -n "${{ matrix.rust_target }}" ]]; then
            cargo xtask package-daemon-bundle --version "$RELEASE_VERSION" --target "${{ matrix.rust_target }}"
          else
            cargo xtask package-daemon-bundle --version "$RELEASE_VERSION"
          fi
      - name: Build daemon bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo --config 'build.rustc-wrapper=""' xtask package-daemon-bundle --version "$env:RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: target/release-bundles/*
          if-no-files-found: error

  publish-release:
    needs: build-bundles
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.publish_release
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: daemon-bundle-*
          merge-multiple: true
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(env.RELEASE_VERSION, '-rc') || contains(env.RELEASE_VERSION, 'preview') }}
