name: Release performance comparison

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Candidate SHA or ref
        required: true
        default: main
      release_tag:
        description: Release tag/label for the generated dataset and asset
        required: true
        default: v0.9.9-rc.6
      harness_ref:
        description: Optional full benchmark harness commit SHA (defaults to workflow commit)
        required: false
      publish_assets:
        description: Publish passing evidence (candidate must equal the existing release tag)
        type: boolean
        default: false
  push:
    tags:
      - v*

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
  HARNESS_REF: ${{ inputs.harness_ref || github.sha }}
  PUBLISH_ASSETS: ${{ startsWith(github.ref, 'refs/tags/') || inputs.publish_assets == true }}

jobs:
  same-runner-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Resolve candidate ref
        id: candidate
        shell: bash
        env:
          CANDIDATE_REF: ${{ inputs.candidate_ref || github.sha }}
        run: echo "ref=$CANDIDATE_REF" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.ref }}
          path: candidate
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HARNESS_REF }}
          path: release-harness
      - uses: actions/checkout@v4
        with:
          ref: v0.9.1
          path: baseline
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pin benchmark harness and publication provenance
        shell: bash
        run: |
          publish=()
          if [[ "$PUBLISH_ASSETS" == true ]]; then publish=(--publish); fi
          python3 release-harness/tools/scripts/performance_release_recovery.py \
            --candidate candidate --harness release-harness \
            --harness-ref "$HARNESS_REF" --release-tag "$RELEASE_TAG" "${publish[@]}"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev
      - name: Install Python crypto backend
        # RNS uses slow pure-Python crypto without it; normal installs have it.
        run: python3 -m pip install "cryptography==46.0.5"
      - name: Check out pinned Python references
        run: |
          git clone https://github.com/markqvist/Reticulum.git refs/Reticulum
          git -C refs/Reticulum checkout ea98db4f53dcf0defc0e71a16e60d28b1229c4e6
          git clone https://github.com/markqvist/LXMF.git refs/LXMF
          git -C refs/LXMF checkout 727830cefda83d9c6e3982b48675425f3f988f9c
          mkdir -p candidate/target/python-references
          ln -s "$GITHUB_WORKSPACE/refs/Reticulum" candidate/target/python-references/Reticulum
          ln -s "$GITHUB_WORKSPACE/refs/LXMF" candidate/target/python-references/LXMF
      - name: Bound hosted Python benchmark iterations
        run: |
          for config in baseline/tools/benchmarks/python_impl.toml candidate/tools/benchmarks/python_impl.toml; do
            sed -i 's/^iterations = 10000$/iterations = 2000/' "$config"
            test "$(grep -c '^iterations = 2000$' "$config")" -eq 2
          done
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          provenance_path = pathlib.Path("candidate/target/performance/lxmf-rs-performance-provenance.json")
          provenance = json.loads(provenance_path.read_text())
          config = "tools/benchmarks/python_impl.toml"
          provenance["benchmark_configurations"] = []
          for checkout in ("candidate", "baseline"):
              original = subprocess.check_output(["git", "-C", checkout, "show", f"HEAD:{config}"])
              measured = (pathlib.Path(checkout) / config).read_bytes()
              provenance["benchmark_configurations"].append({
                  "checkout": checkout, "path": config, "iterations": 2000,
                  "committed_sha256": hashlib.sha256(original).hexdigest(),
                  "measured_sha256": hashlib.sha256(measured).hexdigest(),
              })
          changed = set(subprocess.check_output(
              ["git", "-C", "candidate", "diff", "--name-only", "HEAD"], text=True).splitlines())
          allowed = {item["path"] for item in provenance["overlay_files"]} | {config}
          assert changed <= allowed, f"unexpected candidate changes: {sorted(changed - allowed)}"
          provenance["candidate_product_files_unchanged"] = True
          provenance_path.write_text(json.dumps(provenance, indent=2, sort_keys=True) + "\n")
          PY
      - name: Measure v0.9.1 baseline
        working-directory: baseline
        env:
          PYTHONPATH: ${{ github.workspace }}/refs/Reticulum:${{ github.workspace }}/refs/LXMF
        run: >-
          cargo xtask python-impl-bench-report
          --compare-runs 5
          --resource-runs 2
          --resource-iterations 1000
      - name: Measure release candidate
        working-directory: candidate
        env:
          PYTHONPATH: ${{ github.workspace }}/refs/Reticulum:${{ github.workspace }}/refs/LXMF
        run: >-
          cargo xtask python-impl-bench-report
          --compare-runs 5
          --resource-runs 2
          --resource-iterations 1000
      - name: Measure ZeroMQ and HTTP SDK transports
        working-directory: candidate
        run: |
          cargo build --release -p reticulumd --bin reticulumd
          cargo build --release -p lxmf-sdk --example sdk_transport_benchmark
          cargo build --release -p lxmf-runtime --example in_process_sdk_benchmark
          python3 tools/scripts/sdk_transport_bench.py \
            --output target/performance/sdk-transport.json
      - name: Measure matched E2E workloads
        working-directory: candidate
        run: python3 tools/scripts/e2e_performance.py --profile report --output target/performance/e2e.json
      - name: Measure independent rns-rs workloads
        working-directory: candidate
        run: >-
          python3 tools/scripts/independent_performance.py
          --samples 5
          --links 1000
          --output target/performance/independent.json
      - name: Generate candidate publication dataset
        working-directory: candidate
        run: |
          python3 tools/scripts/performance_docs.py \
            --release "$RELEASE_TAG" \
            --report target/criterion/python-impl-report/report.json \
            --sdk-transport-report target/performance/sdk-transport.json \
            --e2e-report target/performance/e2e.json \
            --independent-performance-report target/performance/independent.json \
            --dashboard-output target/performance/lxmf-rs-performance.html
          cp "docs/performance/${RELEASE_TAG}.json" target/performance/candidate.json
          cp "docs/performance/${RELEASE_TAG}.json" target/performance/lxmf-rs-performance.json
          tar -czf target/performance/lxmf-rs-performance-raw.tar.gz \
            target/criterion/python-impl-report \
            target/performance/e2e-runs \
            target/performance/e2e.json \
            target/performance/independent-runs \
            target/performance/independent.json \
            target/performance/lxmf-rs-performance-provenance.json \
            target/performance/sdk-transport.json
      - name: Apply release regression budgets
        working-directory: candidate
        run: |
          python3 tools/scripts/performance_release_gate.py \
            --candidate target/performance/candidate.json \
            --baseline ../baseline/target/criterion/python-impl-report/report.json \
            --output target/performance/release-gate.json
          python3 tools/scripts/performance_docs.py \
            --release "$RELEASE_TAG" \
            --dashboard-output target/performance/lxmf-rs-performance.html \
            --check
          (
            cd target/performance
            sha256sum \
              lxmf-rs-performance.html \
              lxmf-rs-performance.json \
              lxmf-rs-performance-provenance.json \
              lxmf-rs-performance-raw.tar.gz \
              release-gate.json
          ) > target/performance/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-release-${{ github.run_id }}
          path: |
            candidate/target/criterion/python-impl-report/**
            baseline/target/criterion/python-impl-report/**
            candidate/target/performance/**
            candidate/docs/performance.md
          if-no-files-found: error

  publish-performance-assets:
    needs: same-runner-comparison
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish_assets == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Classify release tag
        id: release-metadata
        env:
          RELEASE_INPUT_TAG: ${{ env.RELEASE_TAG }}
        run: |
          python3 tools/scripts/release_config.py classify \
            --tag "$RELEASE_INPUT_TAG" --version-file VERSION --output "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: performance-release-${{ github.run_id }}
          path: dist
      - name: Collect public performance assets
        shell: bash
        run: |
          mkdir -p release-assets
          find dist -type f -name 'lxmf-rs-performance.html' -exec cp {} release-assets/lxmf-rs-performance.html \;
          find dist -type f -name 'lxmf-rs-performance.json' -exec cp {} release-assets/lxmf-rs-performance.json \;
          find dist -type f -name 'lxmf-rs-performance-provenance.json' -exec cp {} release-assets/lxmf-rs-performance-provenance.json \;
          find dist -type f -name 'release-gate.json' -exec cp {} release-assets/release-gate.json \;
          find dist -type f -name 'SHA256SUMS' -exec cp {} release-assets/SHA256SUMS \;
          find dist -type f -name 'lxmf-rs-performance-raw.tar.gz' -exec cp {} release-assets/lxmf-rs-performance-raw.tar.gz \;
          test -s release-assets/lxmf-rs-performance.html
          test -s release-assets/lxmf-rs-performance.json
          test -s release-assets/SHA256SUMS
          test -s release-assets/lxmf-rs-performance-raw.tar.gz
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path("release-assets")
          provenance = json.loads((root / "lxmf-rs-performance-provenance.json").read_text())
          gate = json.loads((root / "release-gate.json").read_text())
          tag_sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert provenance["release_tag"] == os.environ["RELEASE_TAG"]
          assert provenance["candidate_sha"] == provenance["release_tag_sha"] == tag_sha
          assert gate["candidate_sha"] == tag_sha and gate["status"] in ("pass", "pass_with_warnings")
          PY
          (cd release-assets && sha256sum --check SHA256SUMS)
      - name: Attach public performance assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: false
          prerelease: ${{ steps.release-metadata.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.release-metadata.outputs.prerelease == 'true' && 'false' || 'legacy' }}
