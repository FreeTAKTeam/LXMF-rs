name: Apply remote sync accounting regression patch

on:
  push:
    branches:
      - codex/adversarial-identify-tests

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct authenticated sync accounting assertion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/scripts/python-lxmd-rust-lxmd-smoke.sh")
          text = path.read_text(encoding="utf-8")
          old = '''propagation = status.get("propagation", {})
          assert propagation.get("unpeered_propagation_incoming", 0) >= 1, propagation
          assert propagation.get("unpeered_propagation_rx_bytes", 0) >= python_payload["stored_bytes"], propagation

          source_row = next(
          '''
          new = '''propagation = status.get("propagation", {})
          # LinkIdentify retains the verified identity before the resource transfer.
          # This sync must remain in the peered lane; an unpeered count is an auth regression.
          assert propagation.get("unpeered_propagation_incoming", 0) == 0, propagation
          assert propagation.get("unpeered_propagation_rx_bytes", 0) == 0, propagation

          source_row = next(
          '''
          if old not in text:
              raise SystemExit("remote sync accounting assertion block not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit patch and remove one-shot workflow
        run: |
          rm .github/workflows/patch-remote-sync-accounting.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/scripts/python-lxmd-rust-lxmd-smoke.sh .github/workflows/patch-remote-sync-accounting.yml
          git commit -m "test(interop): classify verified sync traffic as peered"
          git push origin HEAD:codex/adversarial-identify-tests
