[workspace]
resolver = "2"
members = [
  "crates/libs/lxmf",
  "crates/libs/lxmf-reference",
  "crates/libs/lxmf-embedded-mini",
  "crates/libs/rns-embedded-mininode",
  "crates/libs/rns-embedded-core",
  "crates/libs/rns-embedded-ffi",
  "crates/libs/rns-embedded-runtime",
  "crates/libs/lxmf-core",
  "crates/libs/lxmf-sdk",
  "crates/libs/lxmf-runtime",
  "crates/libs/reticulum-rs",
  "crates/libs/rns-core",
  "crates/libs/rns-transport",
  "crates/libs/rns-rpc",
  "crates/libs/test-support",
  "crates/apps/lxmf-cli",
  "crates/apps/reticulumd",
  "crates/apps/rns-tools",
  "xtask",
]
default-members = [
  "crates/libs/lxmf",
  "crates/libs/lxmf-reference",
  "crates/libs/rns-embedded-mininode",
  "crates/libs/rns-embedded-core",
  "crates/libs/rns-embedded-ffi",
  "crates/libs/rns-embedded-runtime",
  "crates/libs/lxmf-core",
  "crates/libs/lxmf-sdk",
  "crates/libs/lxmf-runtime",
  "crates/libs/reticulum-rs",
  "crates/libs/rns-core",
  "crates/libs/rns-transport",
  "crates/libs/rns-rpc",
  "crates/libs/test-support",
  "crates/apps/lxmf-cli",
  "crates/apps/reticulumd",
  "crates/apps/rns-tools",
  "xtask",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "EPL-2.0"
repository = "https://github.com/FreeTAKTeam/LXMF-rs"

[workspace.metadata.boundaries]
# Exact workspace-local dependency edges allowed between crates.
# `tools/scripts/check-boundaries.sh` treats this as a strict allowlist.
allowed_library_edges = [
  "lxmf-sdk->lxmf-reference",
  "lxmf-embedded-mini->lxmf-wire",
  "lxmf->lxmf-sdk",
  "lxmf->lxmf-wire",
  "lxmf-sdk->lxmf-wire",
  "lxmf-sdk->reticulum-rs-rpc",
  "lxmf-runtime->lxmf-sdk",
  "lxmf-runtime->lxmf-wire",
  "lxmf-runtime->reticulum-rs-transport",
  "reticulum-rs->reticulum-rs-core",
  "reticulum-rs->reticulum-rs-rpc",
  "reticulum-rs->reticulum-rs-transport",
  "reticulum-rs-rpc->lxmf-reference",
  "lxmf-wire->reticulum-rs-core",
  "rns-embedded-ffi->rns-embedded-core",
  "rns-embedded-ffi->rns-embedded-runtime",
  "rns-embedded-mininode->lxmf-wire",
  "rns-embedded-mininode->reticulum-rs-core",
  "rns-embedded-runtime->rns-embedded-core",
  "reticulum-rs-transport->reticulum-rs-core",
  "test-support->lxmf-sdk",
  "test-support->lxmf-wire",
  "test-support->reticulum-rs-core",
  "test-support->reticulum-rs-rpc",
]
allowed_app_edges = [
  "lxmf-cli->lxmf-sdk",
  "reticulumd->lxmf-wire",
  "reticulumd->reticulum-rs-core",
  "reticulumd->reticulum-rs-rpc",
  "reticulumd->reticulum-rs-transport",
  "rns-tools->rns-embedded-core",
  "rns-tools->rns-embedded-runtime",
  "rns-tools->reticulum-rs-rpc",
]

[workspace.dependencies]
lxmf-reference = { version = "0.7.1", path = "crates/libs/lxmf-reference" }
rns-embedded-core = { version = "0.7.1", path = "crates/libs/rns-embedded-core" }
rns-embedded-ffi = { version = "0.7.1", path = "crates/libs/rns-embedded-ffi" }
rns-embedded-runtime = { version = "0.7.1", path = "crates/libs/rns-embedded-runtime" }
anyhow = "1"
clap = { version = "4.5.29", features = ["derive"] }
clap_complete = "4.5"
criterion = "0.5"
lxmf = { version = "0.7.1", path = "crates/libs/lxmf" }
lxmf-core = { package = "lxmf-wire", version = "0.7.1", path = "crates/libs/lxmf-core" }
lxmf-sdk = { version = "0.7.1", path = "crates/libs/lxmf-sdk" }
lxmf-runtime = { version = "0.7.1", path = "crates/libs/lxmf-runtime" }
reticulum-rs = { version = "0.7.1", path = "crates/libs/reticulum-rs" }
rns-core = { package = "reticulum-rs-core", version = "0.7.1", path = "crates/libs/rns-core" }
rns-rpc = { package = "reticulum-rs-rpc", version = "0.7.1", path = "crates/libs/rns-rpc" }
rns-transport = { package = "reticulum-rs-transport", version = "0.7.1", path = "crates/libs/rns-transport" }
aes = "0.8.4"
base64 = "0.22"
cbc = "0.1.2"
crypto-common = "0.1.6"
ed25519-dalek = "=2.1.1"
hkdf = "0.12.4"
hmac = "0.12.1"
hex = "0.4"
log = "0.4.27"
tracing = { version = "0.1", features = ["release_max_level_info"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
loom = "0.7"
serde_bytes = "0.11"
rmp-serde = "1.3.0"
rmpv = "1.3.0"
rusqlite = { version = "0.37.0", features = ["bundled"] }
time = "0.3.45"
tokio-util = "0.7.15"
bzip2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2.2"
tempfile = "3"
shlex = "2.0.1"
sha2 = "0.10"
toml = "0.8"
tokio = { version = "1.44.2", features = ["full"] }
tokio-rustls = "0.26.2"
tokio-serial = "5.4.4"
tokio-stream = "0.1"
zeromq = { version = "0.6.0", default-features = false, features = ["tokio-runtime", "tcp-transport"] }
rustls = "0.23.23"
rustls-pemfile = "2.2.0"
x509-parser = "0.16.0"
rand_core = "0.6.4"
x25519-dalek = "2.0.1"
thiserror = "1"
zeroize = "1.8"

[profile.dev.package.reticulum-rs-core]
opt-level = 2

[profile.test.package.reticulum-rs-core]
opt-level = 2

[workspace.lints.rust]
unsafe_code = "forbid"
unused_imports = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"
