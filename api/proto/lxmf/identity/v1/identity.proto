syntax = "proto3";

package lxmf.identity.v1;

import "google/protobuf/struct.proto";
import "lxmf/common/v1/pagination.proto";

// Basic identity metadata exposed to clients.
message Identity {
  string identity = 1;
  string public_key = 2;
  optional string display_name = 3;
  repeated string capabilities = 4;
}

// Contact record stored by the daemon.
message Contact {
  string identity = 1;
  optional string display_name = 2;
  string trust_level = 3;
  bool bootstrap = 4;
  uint64 updated_ts_ms = 5;
  google.protobuf.Struct metadata = 6;
  google.protobuf.Struct extensions = 7;
}

// Presence summary for a discovered peer identity.
message PresenceRecord {
  string peer_id = 1;
  int64 last_seen_ts_ms = 2;
  int64 first_seen_ts_ms = 3;
  uint64 seen_count = 4;
  optional string name = 5;
  optional string name_source = 6;
  optional string trust_level = 7;
  optional bool bootstrap = 8;
  google.protobuf.Struct extensions = 9;
}

// Empty request for listing imported or known identities.
message ListIdentitiesRequest {}

// Returns known identities.
message ListIdentitiesResponse {
  repeated Identity identities = 1;
}

// Resolves a public hash to a known identity id when available.
message ResolveIdentityRequest {
  string hash = 1;
}

// Returns a resolved identity id when found.
message ResolveIdentityResponse {
  optional string identity = 1;
}

// Activates an imported identity as the runtime's current identity.
message ActivateIdentityRequest {
  string identity = 1;
}

// Returns activation acceptance and the selected identity id.
message ActivateIdentityResponse {
  bool accepted = 1;
  string identity = 2;
}

// Imports a serialized identity bundle.
message ImportIdentityRequest {
  string bundle_base64 = 1;
  optional string passphrase = 2;
}

// Returns the normalized imported identity.
message ImportIdentityResponse {
  Identity identity = 1;
}

// Exports one identity as a portable bundle.
message ExportIdentityRequest {
  string identity = 1;
}

// Bundle returned by export.
message IdentityBundle {
  string bundle_base64 = 1;
  optional string passphrase = 2;
  google.protobuf.Struct extensions = 3;
}

// Returns the exported bundle.
message ExportIdentityResponse {
  IdentityBundle bundle = 1;
}

// Requests an immediate announce for the current daemon identity.
message AnnounceNowRequest {}

// Reports whether announce dispatch was accepted.
message AnnounceNowResponse {
  bool accepted = 1;
  uint64 announce_id = 2;
}

// Lists recent presence observations with pagination.
message ListPresenceRequest {
  lxmf.common.v1.PageRequest page = 1;
}

// Returns one presence page.
message ListPresenceResponse {
  repeated PresenceRecord peers = 1;
  lxmf.common.v1.PageInfo page_info = 2;
}

// Creates or updates a contact record.
message UpdateContactRequest {
  string identity = 1;
  optional string display_name = 2;
  optional string trust_level = 3;
  optional bool bootstrap = 4;
  google.protobuf.Struct metadata = 5;
  google.protobuf.Struct extensions = 6;
}

// Returns the normalized stored contact.
message UpdateContactResponse {
  Contact contact = 1;
}

// Lists known contacts with pagination.
message ListContactsRequest {
  lxmf.common.v1.PageRequest page = 1;
}

// Returns one contact page.
message ListContactsResponse {
  repeated Contact contacts = 1;
  lxmf.common.v1.PageInfo page_info = 2;
}

// Marks an identity for bootstrap and optional sync.
message BootstrapIdentityRequest {
  string identity = 1;
  bool auto_sync = 2;
}

// Returns the updated contact plus sync result.
message BootstrapIdentityResponse {
  Contact contact = 1;
  bool synced = 2;
}

// Identity discovery, contact, and bootstrap operations.
service IdentityService {
  // Lists known identities.
  rpc ListIdentities(ListIdentitiesRequest) returns (ListIdentitiesResponse);
  // Resolves a hash to an identity id when known.
  rpc ResolveIdentity(ResolveIdentityRequest) returns (ResolveIdentityResponse);
  // Activates an identity as the current runtime identity.
  rpc ActivateIdentity(ActivateIdentityRequest) returns (ActivateIdentityResponse);
  // Imports an identity bundle.
  rpc ImportIdentity(ImportIdentityRequest) returns (ImportIdentityResponse);
  // Exports an identity bundle.
  rpc ExportIdentity(ExportIdentityRequest) returns (ExportIdentityResponse);
  // Dispatches an immediate announce.
  rpc AnnounceNow(AnnounceNowRequest) returns (AnnounceNowResponse);
  // Lists recent presence records.
  rpc ListPresence(ListPresenceRequest) returns (ListPresenceResponse);
  // Creates or updates a contact.
  rpc UpdateContact(UpdateContactRequest) returns (UpdateContactResponse);
  // Lists contacts.
  rpc ListContacts(ListContactsRequest) returns (ListContactsResponse);
  // Bootstraps an identity for trusted sync flows.
  rpc BootstrapIdentity(BootstrapIdentityRequest) returns (BootstrapIdentityResponse);
}
