syntax = "proto3";

package lxmf.runtime.v1;

import "google/protobuf/struct.proto";

// Store-and-forward limits negotiated for a runtime session.
message NegotiateStoreForwardConfig {
  optional uint32 max_messages = 1;
  optional uint64 max_message_age_ms = 2;
  optional string capacity_policy = 3;
  optional string eviction_priority = 4;
}

// Token-auth backend configuration included during negotiation.
message NegotiateTokenAuthConfig {
  string issuer = 1;
  string audience = 2;
  uint64 jti_cache_ttl_ms = 3;
  optional uint64 clock_skew_ms = 4;
  string shared_secret = 5;
}

// mTLS backend configuration included during negotiation.
message NegotiateMtlsAuthConfig {
  string ca_bundle_path = 1;
  bool require_client_cert = 2;
  optional string allowed_san = 3;
  optional string client_cert_path = 4;
  optional string client_key_path = 5;
}

// RPC backend limits and auth settings negotiated for the runtime.
message NegotiateRpcBackendConfig {
  optional string listen_addr = 1;
  optional uint64 read_timeout_ms = 2;
  optional uint64 write_timeout_ms = 3;
  optional uint32 max_header_bytes = 4;
  optional uint32 max_body_bytes = 5;
  optional NegotiateTokenAuthConfig token_auth = 6;
  optional NegotiateMtlsAuthConfig mtls_auth = 7;
}

// Runtime policy requested during negotiation.
message NegotiateRuntimeConfig {
  string profile = 1;
  optional string bind_mode = 2;
  optional string auth_mode = 3;
  optional string overflow_policy = 4;
  optional uint64 block_timeout_ms = 5;
  optional NegotiateStoreForwardConfig store_forward = 6;
  optional NegotiateRpcBackendConfig rpc_backend = 7;
}

// Negotiates contract version and runtime capabilities.
message NegotiateRequest {
  repeated uint32 supported_contract_versions = 1;
  repeated string requested_capabilities = 2;
  NegotiateRuntimeConfig config = 3;
}

// Returns the active runtime contract and capabilities.
message NegotiateResponse {
  string runtime_id = 1;
  uint32 active_contract_version = 2;
  repeated string effective_capabilities = 3;
}

// Fetches a runtime snapshot, optionally including count-heavy sections.
message GetSnapshotRequest {
  bool include_counts = 1;
}

// Snapshot of the current runtime state.
message GetSnapshotResponse {
  string runtime_id = 1;
  string state = 2;
  uint32 active_contract_version = 3;
  uint64 config_revision = 4;
  repeated string effective_capabilities = 5;
}

// Empty request for fetching the daemon status snapshot.
message GetDaemonStatusRequest {}

// Returns the raw daemon status snapshot for diagnostics.
message GetDaemonStatusResponse {
  google.protobuf.Struct status = 1;
}

// Empty request for fetching propagation status.
message GetPropagationStatusRequest {}

// Returns raw propagation counters and policy fields for diagnostics.
message GetPropagationStatusResponse {
  google.protobuf.Struct propagation = 1;
}

// Updates propagation policy and returns the effective state.
message SetPropagationRequest {
  bool enabled = 1;
  optional string store_root = 2;
  optional uint32 target_cost = 3;
  optional uint64 message_storage_limit_mb = 4;
  optional bool autopeer = 5;
  optional uint32 autopeer_maxdepth = 6;
  repeated string static_peers = 7;
  optional uint32 max_peers = 8;
  optional bool from_static_only = 9;
  optional uint32 peering_cost = 10;
  optional uint32 remote_peering_cost_max = 11;
}

// Returns the effective propagation state after applying an update.
message SetPropagationResponse {
  google.protobuf.Struct propagation = 1;
}

// Runtime negotiation and snapshot operations.
service RuntimeService {
  // Negotiates the active contract version and capability set.
  rpc Negotiate(NegotiateRequest) returns (NegotiateResponse);
  // Returns a point-in-time runtime snapshot.
  rpc GetSnapshot(GetSnapshotRequest) returns (GetSnapshotResponse);
  // Returns the current daemon status snapshot.
  rpc GetDaemonStatus(GetDaemonStatusRequest) returns (GetDaemonStatusResponse);
  // Returns the current propagation status snapshot.
  rpc GetPropagationStatus(GetPropagationStatusRequest) returns (GetPropagationStatusResponse);
  // Updates propagation policy and returns the effective state.
  rpc SetPropagation(SetPropagationRequest) returns (SetPropagationResponse);
}
