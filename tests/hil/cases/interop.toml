[[cases]]
id = "python-channel-interop"
suite = "interop"
description = "Rust and pinned Python Reticulum exchange channel frames."
levels = ["pr", "nightly", "release"]
profiles = ["python-reference"]
requires_env = ["RETICULUM_PY_REPO", "LXMF_PYTHON_BIN"]
timeout_secs = 900
failure_class = "FAIL_PROTOCOL"

[cases.command]
program = "cargo"
args = ["test", "-p", "reticulumd", "--test", "python_channel_interop", "--", "--ignored", "--nocapture"]

[[cases]]
id = "python-paper-interop"
suite = "interop"
description = "Rust and pinned Python LXMF exchange paper messages."
levels = ["pr", "nightly", "release"]
profiles = ["python-reference"]
requires_env = ["RETICULUM_PY_REPO", "LXMF_PY_REPO", "LXMF_PYTHON_BIN"]
timeout_secs = 900
failure_class = "FAIL_PROTOCOL"

[cases.command]
program = "cargo"
args = ["test", "-p", "reticulumd", "--test", "python_paper_interop", "--", "--ignored", "--nocapture"]

[[cases]]
id = "python-lxmd-compatibility"
suite = "interop"
description = "The pinned Python LXMF compatibility matrix stays aligned."
levels = ["pr", "nightly", "release"]
profiles = ["python-reference"]
requires_env = ["RETICULUM_PY_REPO", "LXMF_PY_REPO", "LXMF_PY_COMPAT_HARNESS", "LXMF_PYTHON_BIN"]
timeout_secs = 1200
failure_class = "FAIL_PROTOCOL"

[cases.command]
program = "cargo"
args = ["test", "-p", "reticulumd", "--test", "python_compat_matrix", "--", "--ignored", "--nocapture", "--test-threads=1"]

[[cases]]
id = "python-remote-relay"
suite = "interop"
description = "The Rust LXMD remote relay path interoperates with Python."
levels = ["pr", "nightly", "release"]
profiles = ["python-reference"]
requires_env = ["RETICULUM_PY_REPO", "LXMF_PY_REPO", "LXMF_PYTHON_BIN"]
timeout_secs = 1200
failure_class = "FAIL_PROTOCOL"

[cases.command]
program = "cargo"
args = ["test", "-p", "lxmf-cli", "--test", "python_lxmd_remote_relay", "--", "--ignored", "--skip", "python_to_rust_lxmd_relay_remote_path_e2e", "--nocapture"]

[[cases]]
id = "python-reference-conformance"
suite = "interop"
description = "The pinned Python reference conformance suite remains reproducible."
levels = ["pr", "nightly", "release"]
profiles = ["python-reference"]
requires_env = ["PYTHON_RNS_PATH", "PYTHON_LXMF_PATH"]
timeout_secs = 1200
failure_class = "FAIL_PROTOCOL"

[cases.command]
program = "python"
args = ["-m", "pytest", "tests/", "--reference-only", "-v", "--tb=short", "--deselect", "tests/wire/test_path_discovery.py::test_discover_paths_for_mode_gating[reference->reference->reference-boundary]"]
cwd = "reticulum-conformance"

[[cases]]
id = "python-surface-inventory"
suite = "interop"
description = "The pinned Python public surface inventory remains reproducible."
levels = ["pr", "nightly", "release"]
profiles = ["python-reference"]
requires_env = ["PYTHON_RNS_PATH", "PYTHON_LXMF_PATH"]
timeout_secs = 600
failure_class = "FAIL_PROTOCOL"

[cases.command]
program = "python"
args = ["tools/scripts/python_surface_inventory.py", "--python-rns-path", "Reticulum/RNS", "--python-lxmf-path", "LXMF/LXMF", "--mapping", "docs/status/python-surface-mapping.json", "--json-out", "docs/status/python-surface-parity.json", "--check"]

