timeout_secs = 1500
failure_class = "FAIL_PROTOCOL"

[[cases]]
id = "routing-multi-peer-selection"
suite = "routing"
description = "At least three peers exercise multi-peer route selection and forwarding."
levels = ["nightly", "release"]
timeout_secs = 1800
failure_class = "FAIL_PROTOCOL"

[[cases]]
id = "rnode-link-recovery"
suite = "recovery"
