timeout_secs = 900
failure_class = "FAIL_PROTOCOL"

[[cases]]
id = "announce-and-path"
suite = "routing"
description = "Exercise announce, path request, and path response over the adapter."
levels = ["nightly", "release"]
timeout_secs = 900
failure_class = "FAIL_PROTOCOL"

[[cases]]
id = "rnode-resource-transfer"
suite = "resource"
description = "Two provisioned physical nodes complete a resource transfer and verify its digest."
