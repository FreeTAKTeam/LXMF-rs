[[cases]]
id = "prepared-host-matrix"
suite = "prepared"
description = "The prepared-host adapter emits its native report and preserves raw evidence."
levels = ["nightly", "release"]
profiles = ["esp32", "i2p", "i2p-pair", "auto-interface", "rnode-multi", "rnode-prepared", "reticulum-interface-matrix", "weave"]
timeout_secs = 1800
failure_class = "FAIL_DEVICE"
