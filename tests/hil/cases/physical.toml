[[cases]]
id = "rnode-two-peer-smoke"
suite = "smoke"
description = "Two provisioned physical nodes discover, link, and exchange a payload."
levels = ["nightly", "release"]
timeout_secs = 900
failure_class = "FAIL_DEVICE"

[[cases]]
id = "device-discover-identify"
suite = "smoke"
description = "Discover the adapter and verify stable identity, firmware, and configuration."
levels = ["nightly", "release"]
timeout_secs = 300
failure_class = "FAIL_DEVICE"

[[cases]]
id = "device-connection-reopen"
suite = "smoke"
description = "Open, close, and reopen the adapter connection without stale state."
levels = ["nightly", "release"]
timeout_secs = 300
failure_class = "FAIL_DEVICE"

[[cases]]
id = "packet-single-roundtrip"
suite = "smoke"
description = "Send and receive a single exact-byte packet through the physical path."
levels = ["nightly", "release"]
timeout_secs = 600
failure_class = "FAIL_PROTOCOL"

[[cases]]
id = "packet-boundary-roundtrip"
suite = "smoke"
description = "Send boundary-sized packets and verify exact bytes and timeout behavior."
levels = ["nightly", "release"]
timeout_secs = 600
failure_class = "FAIL_PROTOCOL"

[[cases]]
id = "link-response-and-teardown"
suite = "smoke"
description = "Establish and tear down an RNS link while checking response packets."
