timeout_secs = 1500
failure_class = "FAIL_PROTOCOL"

[[cases]]
id = "rns-resource-uncompressed"
suite = "resource"
description = "Transfer an uncompressed resource and verify its reassembled hash."
levels = ["nightly", "release"]
timeout_secs = 1500
failure_class = "FAIL_PROTOCOL"

[[cases]]
id = "rns-resource-no-hang-peer-failure"
suite = "recovery"
