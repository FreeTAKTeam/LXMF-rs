[[cases]]
id = "resource-retry-budget"
suite = "resource"
description = "A resource retry budget emits a terminal inbound failure."
levels = ["pr", "nightly", "release"]
profiles = ["virtual"]
timeout_secs = 300
failure_class = "FAIL_PROTOCOL"

[cases.command]
program = "cargo"
args = ["test", "-p", "reticulum-rs-transport", "--lib", "resource_manager_emits_inbound_failed_when_retry_budget_exhausts", "--", "--nocapture"]

