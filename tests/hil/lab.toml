version = 1
rack_id = "primary"
lock_env = "HIL_LOCK_PATH"
lock_ttl_secs = 14400
reset_timeout_secs = 120
rf_confirmation_env = "HIL_RF_ENCLOSURE_CONFIRMED"

[[profiles]]
id = "virtual"
label = "Virtual linked peers"
adapter = "virtual"
host = "any"
physical = false
suites = ["core", "resource", "routing", "recovery"]
capabilities = ["fault-injection", "three-peer", "deterministic"]

[[profiles]]
id = "python-reference"
label = "Pinned Python Reticulum/LXMF"
adapter = "python-rns"
host = "linux"
physical = false
suites = ["interop"]
capabilities = ["reticulum-1.5.2", "lxmf-reference"]

[[profiles]]
id = "heltec"
label = "Heltec V3/V4 RNode pair"
adapter = "rnode"
host = "linux"
physical = true
suites = ["smoke", "resource", "routing", "recovery"]
capabilities = ["rnode", "rnode-pair", "rf", "serial"]
identity_env = "HIL_HELTEC_ID"
endpoint_env = "HIL_HELTEC_ENDPOINT"
firmware_env = "HIL_HELTEC_FIRMWARE"
firmware_hash_env = "HIL_HELTEC_FIRMWARE_HASH"
power_hub_env = "HIL_HELTEC_HUB"
power_port_env = "HIL_HELTEC_POWER_PORT"
reset_command_env = "HIL_HELTEC_RESET_COMMAND"
executor_env = "HIL_RNODE_EXECUTOR"
rf_required = true

