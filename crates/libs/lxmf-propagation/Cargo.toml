[package]
name = "lxmf-propagation"
version = "0.14.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared daemon-free LXMF propagation storage and owned-message custody."

[features]
default = ["embedded"]
embedded = ["dep:rand_core"]
daemon = []

[dependencies]
hex.workspace = true
log.workspace = true
hkdf.workspace = true
rmp-serde.workspace = true
rmpv.workspace = true
rusqlite.workspace = true
sha2.workspace = true
lxmf-core.workspace = true
rns-core.workspace = true
rand_core = { workspace = true, features = ["getrandom"], optional = true }
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
