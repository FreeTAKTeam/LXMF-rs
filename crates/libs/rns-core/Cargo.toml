[package]
name = "reticulum-rs-core"
version = "0.8.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Core packet, identity, ratchet, and cryptographic primitives for the Reticulum network stack."
readme = "../../../README.md"
documentation = "https://docs.rs/reticulum-rs-core"
keywords = ["reticulum", "network", "cryptography", "packet"]
categories = ["network-programming", "cryptography"]

[lib]
name = "rns_core"

[dependencies]
aes.workspace = true
cbc.workspace = true
crypto-common = { workspace = true, features = ["rand_core"] }
ed25519-dalek = { workspace = true, features = ["rand_core"] }
hex.workspace = true
hkdf.workspace = true
hmac.workspace = true
rand_core = { workspace = true, features = ["getrandom"] }
rmp-serde.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_bytes.workspace = true
sha2.workspace = true
x25519-dalek = { workspace = true, features = ["static_secrets"] }

[dev-dependencies]
criterion.workspace = true
log.workspace = true
tempfile = { workspace = true }

[features]
default = ["std"]
std = []
alloc = []
fernet-aes128 = []

[[bench]]
name = "parity_hotpaths"
harness = false

[lints]
workspace = true
