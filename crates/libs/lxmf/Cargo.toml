[package]
name = "lxmf"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Umbrella crate for LXMF-rs wire types and the high-level LXMF SDK."
readme = "../../../README.md"
documentation = "https://docs.rs/lxmf"
keywords = ["lxmf", "sdk", "wire", "reticulum"]
categories = ["network-programming", "api-bindings"]

[dependencies]
lxmf-core = { workspace = true, optional = true }
lxmf-sdk = { workspace = true, optional = true }

[features]
default = ["sdk", "wire"]
sdk = ["dep:lxmf-sdk"]
wire = ["dep:lxmf-core"]

[lints]
workspace = true
