[package]
name = "rpp-core"
version = "0.16.2-rc.2-linux"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true
description = "Reticulum Package Protocol (RPP 0.3 RC1) codec, manifest verification and transfer engine."

[features]
default = []
# Async adapter onto reticulum-rs-transport Links and Resources.
rns = ["dep:rns-transport", "dep:tokio", "dep:rmpv"]

[dependencies]
rdo-core.workspace = true
rns-transport = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
rmpv = { workspace = true, optional = true }
log.workspace = true
rand_core = { workspace = true, features = ["getrandom"] }
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
hex.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true

[[test]]
name = "rns_transfer"
required-features = ["rns"]

[lints]
workspace = true
