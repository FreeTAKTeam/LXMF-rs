[package]
name = "rns-tools"
version = "0.10.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Reticulum diagnostic and embedded tooling binaries for LXMF-rs."
build = "build.rs"

[dependencies]
clap.workspace = true
tempfile.workspace = true
serde_json.workspace = true
serde = { workspace = true, features = ["derive"] }
rmp-serde.workspace = true
rmpv = { workspace = true, features = ["with-serde"] }
base64.workspace = true
sha2.workspace = true
hex.workspace = true
socket2 = { version = "0.5", features = ["all"] }
log = { workspace = true }
tracing-subscriber = { workspace = true }
rns-embedded-core = { path = "../../libs/rns-embedded-core", version = "0.10.0" }
rns-embedded-runtime = { path = "../../libs/rns-embedded-runtime", version = "0.10.0", features = ["std"] }
rns_rpc = { package = "reticulum-rs-rpc", path = "../../libs/rns-rpc", version = "0.10.0" }
rns_transport = { package = "reticulum-rs-transport", path = "../../libs/rns-transport", version = "0.10.0" }
rand_core = { workspace = true, features = ["getrandom"] }

[target.'cfg(any(target_os = "android", target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
btleplug = "0.12"
futures = "0.3.31"
uuid = "1.16.0"
tokio = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Unify btleplug's Linux dbus dependency with its vendored feature so musl
# release builds do not try to probe a host glibc dbus installation.
dbus = { version = "0.9.11", features = ["vendored"] }

[lints]
workspace = true
