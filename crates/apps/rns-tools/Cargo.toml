[package]
name = "rns-tools"
version = "0.5.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Reticulum diagnostic and embedded tooling binaries for LXMF-rs."
build = "build.rs"

[dependencies]
clap.workspace = true
tempfile.workspace = true
serde_json.workspace = true
base64.workspace = true
sha2.workspace = true
hex.workspace = true
log = { workspace = true }
tracing-subscriber = { workspace = true }
rns-embedded-core = { path = "../../libs/rns-embedded-core", version = "0.5.2" }
rns-embedded-runtime = { path = "../../libs/rns-embedded-runtime", version = "0.5.2", features = ["std"] }
rns_rpc = { package = "reticulum-rs-rpc", path = "../../libs/rns-rpc", version = "0.5.2" }

[target.'cfg(any(target_os = "android", target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
btleplug = "0.12"
futures = "0.3.31"
uuid = "1.16.0"
tokio = { workspace = true }

[lints]
workspace = true
