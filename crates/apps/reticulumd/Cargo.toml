[package]
name = "reticulumd"
version = "0.9.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Reticulum daemon and interchange binaries for LXMF-rs deployments."

[lib]
name = "reticulum_daemon"

[dependencies]
rns_transport = { package = "reticulum-rs-transport", path = "../../libs/rns-transport", version = "0.9.1" }
rns_rpc = { package = "reticulum-rs-rpc", path = "../../libs/rns-rpc", version = "0.9.1" }
lxmf = { package = "lxmf-wire", path = "../../libs/lxmf-core", version = "0.9.1", default-features = false, features = ["std"] }
rns_core = { package = "reticulum-rs-core", path = "../../libs/rns-core", version = "0.9.1" }
base64 = { workspace = true }
clap = { workspace = true, features = ["derive"] }
rand_core = { workspace = true, features = ["getrandom"] }
x25519-dalek = { workspace = true }
ed25519-dalek = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
rmpv = { workspace = true }
rmp-serde = { workspace = true }
sha2 = { workspace = true }
hkdf = { workspace = true }
hex = { workspace = true }
if-addrs = "0.15.0"
log = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
x509-parser = { workspace = true }
zeromq = { workspace = true, optional = true }

[features]
default = []
zmq-pipeline-rpc = ["dep:zeromq"]
rnode-ble = ["rns_transport/rnode-ble"]
vrn76-kiss-ble = ["rns_transport/vrn76-kiss-ble"]

[dev-dependencies]
tempfile = { workspace = true }

[[bin]]
name = "reticulumd"
path = "src/bin/reticulumd/main.rs"

[[bin]]
name = "lxm-interchange"
path = "src/bin/lxm-interchange.rs"

[[test]]
name = "code_quality_issue_369"
path = "tests/code_quality_issue_369.rs"

[target.'cfg(any(target_os = "android", target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
btleplug = "0.12"
futures = "0.3.31"
uuid = "1.16.0"
