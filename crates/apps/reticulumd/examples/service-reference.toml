# Reference integration: service-hosted reticulumd

[rpc]
listen = "127.0.0.1:7443"
bind_mode = "local_only"
auth_mode = "local_trusted"

[runtime]
profile = "desktop-local-runtime"
overflow_policy = "reject"
idempotency_ttl_ms = 43200000

[redaction]
enabled = true
sensitive_transform = "hash"
break_glass_allowed = false

[propagation_node]
enabled = false
control_allowed = []
peer_announce_at_start = false
peer_announce_interval_secs = 300
node_announce_at_start = false
node_announce_interval_secs = 300
transfer_limit_kb = 256
sync_limit_kb = 10240
stamp_cost = 16
stamp_cost_flexibility = 3
peering_cost = 18
# Durable propagation payload and peer-entry bounds. These defaults prevent a
# busy node from creating one SQLite row for every payload/peer combination.
message_storage_limit_mb = 256
peer_entry_limit = 1000000
peer_entry_limit_per_peer = 1024
peer_entry_ttl_secs = 604800
completed_peer_entry_ttl_secs = 2592000
max_propagation_peers = 512
storage_maintenance_interval_secs = 300
