openapi: 3.1.1
info:
  title: Reticulum MeshChat application HTTP interface
  version: 2.4.0-source.df5aea9-spec.1
  description: Source-derived contract for liamcottle/reticulum-meshchat, not the RNS or LXMF network protocol and
    not an already implemented LXMF-rs API. Covers every explicit route in meshchat.py, including both WebSocket
    handshakes. Behaviours are as implemented at the pinned commit. Schemas describe normal application payloads;
    documented weak validation/coercions are not silently repaired. Dependency-owned RNS pass-through fields remain
    open. Read README.md and audit-notes.md before implementing.
  license:
    name: Specification generated for LXMF-rs; upstream code is MIT licensed
servers:
- url: http://127.0.0.1:8000
  description: Upstream CLI defaults; host and port are configurable.
security: []
tags:
- name: General
- name: Configuration
