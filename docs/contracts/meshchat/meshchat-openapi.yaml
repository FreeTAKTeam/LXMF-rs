          content:
            text/plain:
              schema:
                type: string
        '422':
          description: Missing name/type/type-specific required setting, duplicate name without overwrite, empty/invalid
            RNodeMultiInterface list, or missing sub-interface fields. JSON message identifies the first failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
