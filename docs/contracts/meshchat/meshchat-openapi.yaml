      summary: Add or overwrite a saved interface
      description: Writes config and returns HTTP 200 with "Interface has been added. Please restart MeshChat for
        these changes to take effect." or "Interface has been saved. Please restart MeshChat for these changes to
        take effect." Unknown types are not rejected. Omitted optional values may delete existing settings. Invalid
        int() conversions can produce 500.
      responses:
