<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2000" viewBox="0 0 1600 2000" role="img" aria-labelledby="title description">
  <title id="title">LXMF-rs performance: fast operations, scalable networks</title>
  <desc id="description">An infographic comparing Rust and Python benchmark medians for protocol operations and an exploratory 100-node chain simulation.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0b1c2f"/>
    </linearGradient>
    <linearGradient id="rustGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="networkGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16a34a"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000814" flood-opacity="0.38"/>
    </filter>
    <style>
      .font { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .eyebrow { font-size: 22px; font-weight: 700; letter-spacing: 3px; fill: #67e8f9; }
      .title { font-size: 72px; font-weight: 800; letter-spacing: -2px; fill: #f8fafc; }
      .subtitle { font-size: 28px; font-weight: 400; fill: #a9bfd6; }
      .section-kicker { font-size: 20px; font-weight: 800; letter-spacing: 2px; fill: #67e8f9; }
      .section-title { font-size: 42px; font-weight: 800; fill: #f8fafc; }
      .section-note { font-size: 22px; fill: #9db3c8; }
      .card-title { font-size: 25px; font-weight: 700; fill: #dce9f5; }
      .metric { font-size: 72px; font-weight: 850; letter-spacing: -2px; fill: #fff7ed; }
      .metric-label { font-size: 22px; font-weight: 650; fill: #fed7aa; }
      .small { font-size: 19px; fill: #9db3c8; }
      .bar-label { font-size: 21px; font-weight: 650; fill: #dce9f5; }
      .bar-value { font-size: 21px; font-weight: 800; fill: #fff7ed; }
      .network-head { font-size: 28px; font-weight: 800; fill: #f8fafc; }
      .network-label { font-size: 19px; fill: #9db3c8; }
      .network-value { font-size: 27px; font-weight: 800; fill: #f8fafc; }
      .pill { font-size: 18px; font-weight: 800; letter-spacing: 1px; }
      .callout { font-size: 38px; font-weight: 850; fill: #f8fafc; }
      .callout-label { font-size: 19px; font-weight: 650; fill: #a9bfd6; }
      .footer { font-size: 18px; fill: #7890a6; }
    </style>
  </defs>

  <rect width="1600" height="2000" fill="url(#background)"/>
  <circle cx="1440" cy="110" r="280" fill="#f97316" opacity="0.07"/>
  <circle cx="120" cy="1850" r="300" fill="#22d3ee" opacity="0.06"/>

  <g class="font">
    <text x="80" y="82" class="eyebrow">LXMF-RS PERFORMANCE SNAPSHOT</text>
    <text x="80" y="165" class="title">Fast operations.</text>
    <text x="80" y="246" class="title">Scalable networks.</text>
    <text x="80" y="300" class="subtitle">Rust vs Python • release v0.9.5 • p50 medians</text>

    <!-- Single-operation section -->
    <text x="80" y="382" class="section-kicker">01  SINGLE EXECUTION</text>
    <text x="80" y="433" class="section-title">Rust accelerates protocol hot paths</text>
    <text x="80" y="472" class="section-note">5 interleaved comparison runs • fixture setup excluded from timed regions</text>

    <g filter="url(#shadow)">
      <rect x="80" y="510" width="1440" height="255" rx="28" fill="#10253a" stroke="#26415a"/>
      <rect x="80" y="510" width="18" height="255" rx="9" fill="url(#rustGradient)"/>
    </g>
    <text x="135" y="566" class="card-title">LXMF MESSAGE DECODE</text>
    <text x="135" y="675" class="metric">576.59×</text>
    <text x="137" y="716" class="metric-label">Rust speed advantage</text>

    <text x="760" y="570" class="small">RUST p50</text>
    <text x="760" y="625" font-size="42" font-weight="800" fill="#fb923c">150 ns</text>
    <rect x="760" y="650" width="10" height="22" rx="11" fill="#fb923c"/>

    <text x="1000" y="570" class="small">PYTHON p50</text>
    <text x="1000" y="625" font-size="42" font-weight="800" fill="#60a5fa">86.56 µs</text>
    <rect x="1000" y="650" width="435" height="22" rx="11" fill="#60a5fa"/>
    <text x="760" y="721" class="small">Same operation • lower latency is better</text>

    <rect x="80" y="795" width="1440" height="74" rx="20" fill="#0d2235" stroke="#24425d"/>
    <circle cx="122" cy="832" r="13" fill="#22c55e"/>
    <text x="153" y="840" font-size="23" font-weight="750" fill="#dce9f5">Rust p50 ≤ Python p50 in 18 / 18 measured hot paths</text>
    <rect x="1048" y="812" width="431" height="40" rx="20" fill="#193b2c"/>
    <text x="1264" y="839" text-anchor="middle" font-size="19" font-weight="800" fill="#86efac">15 OF 18 WERE AT LEAST 2× FASTER</text>

    <text x="80" y="925" class="card-title">Selected Rust speed advantages</text>
    <text x="1510" y="925" text-anchor="end" class="small">Python p50 ÷ Rust p50</text>

    <text x="80" y="979" class="bar-label">Large message decode • 2 KiB</text>
    <rect x="560" y="954" width="880" height="32" rx="16" fill="#18324a"/>
    <rect x="560" y="954" width="880" height="32" rx="16" fill="url(#rustGradient)"/>
    <text x="1490" y="979" text-anchor="end" class="bar-value">371.58×</text>

    <text x="80" y="1033" class="bar-label">Resource-sized decode • 16 KiB</text>
    <rect x="560" y="1008" width="880" height="32" rx="16" fill="#18324a"/>
    <rect x="560" y="1008" width="514" height="32" rx="16" fill="url(#rustGradient)"/>
    <text x="1490" y="1033" text-anchor="end" class="bar-value">217.07×</text>

    <text x="80" y="1087" class="bar-label">Message encode</text>
    <rect x="560" y="1062" width="880" height="32" rx="16" fill="#18324a"/>
    <rect x="560" y="1062" width="330" height="32" rx="16" fill="url(#rustGradient)"/>
    <text x="1490" y="1087" text-anchor="end" class="bar-value">139.59×</text>

    <text x="80" y="1141" class="bar-label">Reticulum packet pack</text>
    <rect x="560" y="1116" width="880" height="32" rx="16" fill="#18324a"/>
    <rect x="560" y="1116" width="282" height="32" rx="16" fill="url(#rustGradient)"/>
    <text x="1490" y="1141" text-anchor="end" class="bar-value">119.10×</text>

    <text x="80" y="1195" class="bar-label">Resource request window</text>
    <rect x="560" y="1170" width="880" height="32" rx="16" fill="#18324a"/>
    <rect x="560" y="1170" width="231" height="32" rx="16" fill="url(#rustGradient)"/>
    <text x="1490" y="1195" text-anchor="end" class="bar-value">97.50×</text>

    <!-- Large-network section -->
    <text x="80" y="1284" class="section-kicker">02  LARGE NETWORK MANAGEMENT</text>
    <text x="80" y="1335" class="section-title">100 nodes reveal the scaling difference</text>
    <text x="80" y="1374" class="section-note">99 simulated media • 60 s warm-up • 6 concurrent 256-byte messages • single host</text>

    <!-- column cards -->
    <g filter="url(#shadow)">
      <rect x="80" y="1415" width="448" height="390" rx="26" fill="#10253a" stroke="#344b61"/>
      <rect x="576" y="1415" width="448" height="390" rx="26" fill="#10253a" stroke="#344b61"/>
      <rect x="1072" y="1415" width="448" height="390" rx="26" fill="#10253a" stroke="#2b7657" stroke-width="2"/>
    </g>

    <rect x="108" y="1443" width="92" height="34" rx="17" fill="#57252c"/>
    <text x="154" y="1467" text-anchor="middle" class="pill" fill="#fca5a5">FAIL</text>
    <text x="108" y="1520" class="network-head">100 Python</text>
    <text x="108" y="1573" class="network-label">READY</text>
    <text x="108" y="1608" class="network-value">1.761 s</text>
    <text x="284" y="1573" class="network-label">DELIVERED</text>
    <text x="284" y="1608" class="network-value" fill="#fca5a5">3 / 6</text>
    <text x="108" y="1667" class="network-label">END-TO-END RTT</text>
    <text x="108" y="1702" class="network-value">25.180 s / —</text>
    <text x="108" y="1761" class="network-label">MEDIA TRANSMISSIONS</text>
    <text x="108" y="1796" class="network-value">35,662</text>

    <rect x="604" y="1443" width="92" height="34" rx="17" fill="#184a37"/>
    <text x="650" y="1467" text-anchor="middle" class="pill" fill="#86efac">PASS</text>
    <text x="604" y="1520" class="network-head">50 Python / 50 Rust</text>
    <text x="604" y="1573" class="network-label">READY</text>
    <text x="604" y="1608" class="network-value">1.517 s</text>
    <text x="780" y="1573" class="network-label">DELIVERED</text>
    <text x="780" y="1608" class="network-value">6 / 6</text>
    <text x="604" y="1667" class="network-label">END-TO-END RTT</text>
    <text x="604" y="1702" class="network-value">0.456 s / 0.770 s</text>
    <text x="604" y="1761" class="network-label">MEDIA TRANSMISSIONS</text>
    <text x="604" y="1796" class="network-value">4,411</text>

    <rect x="1100" y="1443" width="92" height="34" rx="17" fill="#184a37"/>
    <text x="1146" y="1467" text-anchor="middle" class="pill" fill="#86efac">PASS</text>
    <text x="1100" y="1520" class="network-head">100 Rust</text>
    <text x="1100" y="1573" class="network-label">READY</text>
    <text x="1100" y="1608" class="network-value" fill="#86efac">0.253 s</text>
    <text x="1276" y="1573" class="network-label">DELIVERED</text>
    <text x="1276" y="1608" class="network-value" fill="#86efac">6 / 6</text>
    <text x="1100" y="1667" class="network-label">END-TO-END RTT</text>
    <text x="1100" y="1702" class="network-value">0.112 s / 0.192 s</text>
    <text x="1100" y="1761" class="network-label">MEDIA TRANSMISSIONS</text>
    <text x="1100" y="1796" class="network-value" fill="#86efac">1,368</text>

    <rect x="80" y="1842" width="1440" height="92" rx="24" fill="#0f2d32" stroke="#236a64"/>
    <text x="170" y="1892" text-anchor="middle" class="callout">7.0×</text>
    <text x="300" y="1886" class="callout-label">faster readiness</text>
    <text x="670" y="1892" text-anchor="middle" class="callout">26.1×</text>
    <text x="810" y="1886" class="callout-label">fewer media transmissions</text>
    <text x="1228" y="1892" text-anchor="middle" class="callout">6 / 6</text>
    <text x="1350" y="1886" class="callout-label">messages delivered</text>
    <text x="800" y="1921" text-anchor="middle" font-size="17" fill="#69aeb1">All-Rust vs all-Python composition</text>

    <text x="80" y="1966" class="footer">Network results are exploratory single runs in a shared-host simulator, not a repeated benchmark distribution or release threshold.</text>
    <text x="80" y="1991" class="footer">Source: docs/performance.md • benchmark evidence dated 2026-07-16 / 2026-07-20</text>
  </g>
</svg>
